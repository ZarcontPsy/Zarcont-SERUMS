<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Banqueo · banco de exámenes SERUMS por profesión, con trazabilidad al PDF original, revisión de claves y práctica.">
  <meta name="theme-color" content="#070708">
  <title>Banqueo · Examen Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;520;550;600;650;700;750;800&family=Zen+Dots&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2.1.6">
  <link rel="stylesheet" href="../serums-chrome.css?v=1.0.0">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("banqueo-theme-v1") || localStorage.getItem("es-theme");
        var theme = saved === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f1efe9" : "#070708");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#app">Saltar al contenido</a>
  <div class="loading-overlay" id="boot" role="status" aria-live="polite">
    <div class="boot-mark">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="display">BANQUEO</span>
    </div>
    <span>Cargando 51 exámenes y 5.100 preguntas…</span>
  </div>
  <header class="topbar" id="topbar"></header>
  <main class="shell" id="app" tabindex="-1"></main>
  <footer class="app-foot" id="foot"></footer>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript>
    <div style="padding:40px;font-family:system-ui;color:#fff;background:#070708">
      Banqueo necesita JavaScript activado para procesar los PDFs y mostrar el banco.
    </div>
  </noscript>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="../serums-chrome.js?v=1.0.0"></script>
  <script src="datos/banco-oficial.js?v=2.1.5"></script>
  <script src="js/store.js?v=2.1.6"></script>
  <script src="js/parser.js?v=2.1.6"></script>
  <script src="js/app.js?v=2.1.6"></script>
</body>
</html>
