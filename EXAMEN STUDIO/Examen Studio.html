<h2>Revisión</h2><div class="row">${[['all','Todas'],['bad','Incorrectas'],['ok','Correctas'],['om','Omitidas'],['mk','Marcadas']].map(([k,t])=>`<button class="btn s ${f===k?'p':''}" data-act="rf" data-k="${k}">${t}</button>`).join('')}</div><div style="margin-top:12px">
${rows.map(d=>{const q=S.qm[d.id],k=S.km[d.id]||[],h=fm[d.id]||{fails:0,total:0};return `<div class="card"><div class="meta">Pregunta original ${e(q.num)} · página ${q.page} · <span class="${d.ok?'bd ok':d.ok===false?'bd bad':'bd wn'}">${d.ok?'Correcta':d.ok===false?'Incorrecta':'Omitida'}</span> · Récord: ${h.fails}/${h.total} fallos${h.fails?' <span class="bd bad">⚠ '+h.fails+'×</span>':''}</div><p class="q">${e(q.statement)}</p>${q.options.map(o=>`<div class="opt ${k.includes(o.id)?'good':d.sel.includes(o.id)?'bad':''}"><b>${o.id}</b><span>${e(o.text)}${d.sel.includes(o.id)?' <i class="t2">(tu respuesta)</i>':''}${k.includes(o.id)?' <i class="t2">(correcta)</i>':''}</span></div>`).join('')}</div>`}).join('')||'<p class="t2">Sin preguntas en este filtro.</p>'}</div>`},
rank(){return `<div class="eyebrow">Clasificación</div><h1>Ranking</h1><div class="row"><select data-f="rx" style="flex:1;min-width:160px">${S.exams.map(x=>`<option value="${x.id}" ${(defEx())===x.id?'selected':''}>${e(x.title)}</option>`).join('')}</select><select data-f="rm" style="width:auto"><option value="best">Mejor resultado por participante</option><option value="all" ${S.f.rm==='all'?'selected':''}>Todos los intentos</option></select><input data-f="rs" placeholder="Buscar nombre" value="${e(S.f.rs||'')}" style="flex:1;min-width:140px"></div><label class="f"><input type="checkbox" data-f="rt" ${S.f.rt?'checked':''}>Desempatar por menor tiempo</label><p class="t2">Ranking local de este navegador. Sin cuentas: los intentos con el mismo nombre se agrupan como una misma persona.</p><div id="rk">${rkBody()}</div>`},
hist(){const D=S.atts.filter(a=>a.status==='done'&&(!S.f.ex||a.examId===S.f.ex)).sort((a,b)=>a.doneAt-b.doneAt),ex=id=>S.exams.find(x=>x.id===id)?.title||'(eliminado)';
return `<h1>Historial</h1><select data-f="ex"><option value="">Todos los exámenes</option>${S.exams.map(x=>`<option value="${x.id}" ${S.f.ex===x.id?'selected':''}>${e(x.title)}</option>`).join('')}</select>
${D.length?`<div class="card" style="margin-top:12px"><div class="chart">${D.slice(-20).map(a=>`<i style="height:${Math.max(2,a.pct)}%" title="${a.pct}%"></i>`).join('')}</div><p class="t2">${D.length<3?'Pocos intentos: aún no hay tendencia fiable.':'Últimos '+Math.min(20,D.length)+' intentos (% de aciertos).'}</p></div>
<div class="card" style="overflow-x:auto"><table><tr><th>Examen</th><th>Fecha</th><th>Puntos</th><th>%</th><th>Tiempo</th><th>Preg.</th><th></th></tr>${[...D].reverse().map(a=>`<tr><td>${e(ex(a.examId))}</td><td>${fd(a.doneAt)}</td><td>${a.score}/${a.max}</td><td>${a.pct}%</td><td>${ft(Math.min(a.doneAt-a.startedAt,(a.limit||1e12)*1000)/1000)}</td><td>${a.order.length}</td><td><button class="btn s" data-act="open" data-id="${a.id}">Revisar</button></td></tr>`).join('')}</table></div>`:empty('No hay intentos finalizados.')}`}};
const defEx=()=>S.f.rx||S.atts.filter(a=>a.status==='done').sort((a,b)=>b.doneAt-a.doneAt)[0]?.examId||S.exams[0]?.id;
const cmp=(a,b)=>b.pct-a.pct||(a.max===b.max?b.score-a.score:0)||(S.f.rt?a.dur-b.dur:0);
function rkBody(){const ex=defEx(),all=S.atts.filter(a=>a.status==='done'&&a.examId===ex).map(a=>({...a,dur:Math.min(a.doneAt-a.startedAt,(a.limit||1e12)*1000)/1000,nm:(a.name||'Sin nombre').trim()}));
 if(!all.length)return empty('Aún no hay intentos completados de este examen.');
 let L=all;if((S.f.rm||'best')==='best'){const m={};all.forEach(a=>{const k=a.nm.toLowerCase();if(!m[k]||cmp(a,m[k])<0)m[k]=a});L=Object.values(m)}
 L.sort(cmp);let pos=0;L.forEach((a,i)=>{if(!i||cmp(a,L[i-1])!==0)pos=i+1;a.pos=pos});
 const q=(S.f.rs||'').toLowerCase(),sh=L.filter(a=>a.nm.toLowerCase().includes(q));
 return `<div class="stats"><div class="card"><b>${new Set(all.map(a=>a.nm.toLowerCase())).size}</b><span class="t2">Participantes</span></div><div class="card"><b>${Math.max(...all.map(a=>a.pct))}%</b><span class="t2">Mejor resultado</span></div><div class="card"><b>${r2(all.reduce((s,a)=>s+a.pct,0)/all.length)}%</b><span class="t2">Promedio (${all.length} intentos)</span></div></div>${new Set(all.map(a=>a.max)).size>1?'<p class="t2">Los intentos usan distinto número de preguntas: se compara por porcentaje.</p>':''}<div class="card" style="overflow-x:auto;margin-top:12px"><table><tr><th>Pos.</th><th>Nombre</th><th>Puntos</th><th>%</th><th>Fecha</th><th>Tiempo</th><th></th></tr>${sh.map(a=>`<tr><td><b>${a.pos<=3?['🥇','🥈','🥉'][a.pos-1]+' ':''}${a.pos}.º</b></td><td>${e(a.nm)}</td><td>${a.score}/${a.max}</td><td>${a.pct}%</td><td>${fd(a.doneAt)}</td><td>${ft(a.dur)}</td><td><button class="btn s" data-act="open" data-id="${a.id}">Detalle</button></td></tr>`).join('')}</table></div>`}
function lst(){let x=S.exams.filter(z=>(z.title+' '+(z.category||'')).toLowerCase().includes(S.f.q.toLowerCase()));
 const lu=z=>att(z.id).at(-1)?.doneAt||0;x.sort((a,b)=>S.f.sort==='name'?a.title.localeCompare(b.title):S.f.sort==='used'?lu(b)-lu(a):b.createdAt-a.createdAt);
 return x.length?`<div class="${S.f.view}">${x.map(card).join('')}</div>`:empty(S.exams.length?'Sin resultados.':'Tu biblioteca está vacía.','<button class="btn p" data-act="go" data-v="imp">Importar PDF</button>')}
function sumRv(){const q=S.rv.qs;return `<div class="stats"><div class="card"><b>${S.rv.pages}</b><span class="t2">Páginas</span></div><div class="card"><b>${q.length}</b><span class="t2">Preguntas</span></div><div class="card"><b>${q.filter(z=>z.status==='valid').length}</b><span class="t2">Validadas</span></div><div class="card"><b>${q.filter(z=>z.status==='pending').length}</b><span class="t2">Por revisar</span></div></div>`}
function rvHtml(){const r=S.rv;return `<div class="card"><label class="f">Nombre del examen<input data-f="rn" value="${e(r.name)}"></label></div><div id="sm">${sumRv()}</div>
${r.warns.length?`<div class="card"><b class="bd wn">Advertencias</b>${r.warns.map(w=>`<div class="meta">${e(w)}</div>`).join('')}</div>`:''}
<p class="t2">Revisa cada pregunta. Aquí se ve la respuesta detectada; solo las validadas serán calificables.</p>
${r.qs.map((q,i)=>`<div class="card"><div class="row"><b>#${e(q.num)} · p. ${q.page}</b><span class="bd ${q.status==='valid'?'ok':q.status==='pending'?'wn':'bad'}" id="b${i}">${bl(q)}</span><button class="btn s d sp" data-act="rq" data-i="${i}">Quitar</button></div>
<textarea data-i="${i}" data-f="s">${e(q.statement)}</textarea><details><summary class="t2">Texto original extraído</summary><pre style="white-space:pre-wrap;font-size:13px">${e(q.raw||'')}</pre></details>${q.options.map(o=>`<label class="row" style="margin:6px 0"><input type="radio" style="width:auto" name="r${i}" data-i="${i}" data-f="c" value="${o.id}" ${q.correct.includes(o.id)?'checked':''}><b>${e(o.mk||o.id)}</b><input data-i="${i}" data-f="o" data-o="${o.id}" value="${e(o.text)}" style="flex:1"></label>`).join('')}
<label class="f"><input type="checkbox" data-i="${i}" data-f="x" ${q.status==='excluded'?'checked':''}>No calificable</label></div>`).join('')}
<div class="row"><button class="btn p" data-act="saverv">Confirmar y guardar</button><button class="btn" data-act="cancelrv">Descartar</button></div>`}
const bl=q=>q.status==='valid'?'Validada'+(q.conf==='media'?' · comprobar':''):q.status==='excluded'?'No calificable':q.det.length>1?'Ambigua':'Sin respuesta';
/* ---------- Acciones ---------- */
async function handleFiles(files){S.imp=[];
 for(const f of files){const m={name:f.name,msg:'Procesando…'};S.imp.push(m);draw();
  try{const r=await parse(f,(p,n)=>{const el=$('#pg');if(el)el.textContent=f.name+': página '+p+' de '+n});S.queue.push(r);m.msg=r.qs.length+' preguntas detectadas.'}catch(er){m.err=1;m.msg=er.message||'Error al procesar.'}}
 if(!S.rv)S.rv=S.queue.shift()||null;draw()}
async function saveRv(){const r=S.rv,v=r.qs.filter(q=>q.status==='valid'),ex={id:uid(),title:r.name.trim()||'Sin título',originalFilename:r.file,fileHash:r.hash,pageCount:r.pages,totalQuestions:r.qs.length,validated:v.length,pending:r.qs.filter(q=>q.status!=='valid').length,createdAt:Date.now(),category:'',tags:[]};
 try{await DB.put('exams',ex);for(const q of r.qs){await DB.put('questions',{id:q.id,examId:ex.id,page:q.page,num:q.num,statement:q.statement,options:q.options,status:q.status,conf:q.conf,raw:q.raw,ord:r.qs.indexOf(q)});
  if(q.status==='valid')await DB.put('keys',{id:q.id,examId:ex.id,correct:q.correct,source:q.det.length===1&&q.det[0]===q.correct[0]?'resaltado':'manual',at:Date.now()})}}
 catch(er){toast(er.name==='QuotaExceededError'?'No hay espacio suficiente en el navegador.':'Error al guardar el examen.');return}
 toast('Examen guardado');S.rv=S.queue.shift()||null;S.imp=[];S.rv?draw():go('lib')}
async function begin(id){const nm=($('#c-name').value||'').trim().replace(/\s+/g,' ');if(!nm)return toast('Escribe el nombre del participante');if(S.busy)return;S.busy=1;S.lastName=nm;const x=S.exams.find(z=>z.id===id),all=(await DB.all('questions')).filter(q=>q.examId===id&&q.status==='valid').sort((a,b)=>(a.ord??0)-(b.ord??0)||(+a.num-+b.num)),g=i=>$(i),
 cfg={n:Math.min(all.length,Math.max(1,+g('#c-n').value||all.length)),min:+g('#c-t').value||0,mode:g('#c-m').value,shuf:g('#c-s').checked,so:g('#c-o').checked,chg:g('#c-c').checked,num:g('#c-u').checked,pen:+g('#c-p').value||0,pts:1};
 let ids=all.map(q=>q.id);if(cfg.shuf)ids=shuf(ids);ids=ids.slice(0,cfg.n);
 const a={id:uid(),name:nm,examId:id,startedAt:Date.now(),status:'prog',cfg,order:ids,resp:{},marks:{},oo:{},i:0,limit:cfg.min*60};
 if(cfg.so)all.forEach(q=>{if(ids.includes(q.id))a.oo[q.id]=shuf(q.options.map(o=>o.id))});
 await DB.put('attempts',a);S.busy=0;await open_(a)}
async function open_(a){const qs=(await DB.all('questions')).filter(q=>q.examId===a.examId);S.qm=Object.fromEntries(qs.map(q=>[q.id,q]));S.ex=S.exams.find(x=>x.id===a.examId)||(await load(),S.exams.find(x=>x.id===a.examId));S.a=a;S.fb={};await go('exam')}
function startTick(){clearInterval(tick);const t=()=>{const el=$('#tm'),a=S.a;if(!el)return;if(a.limit){const r=a.limit-(Date.now()-a.startedAt)/1000;el.textContent='⏱ '+ft(r);if(r<=0)finish(true)}else el.textContent='Sin límite'};t();tick=setInterval(t,1000)}
async function grade(a){const ks=Object.fromEntries((await DB.all('keys')).map(k=>[k.id,k.correct]));let c=0,w=0,o=0,sc=0;
 a.det=a.order.map(id=>{const s=a.resp[id]||[],k=ks[id]||[];if(!s.length){o++;return{id,sel:s,ok:null}}const ok=s.length===k.length&&s.every(x=>k.includes(x));if(ok){c++;sc+=a.cfg.pts}else{w++;sc-=a.cfg.pen}return{id,sel:s,ok}});
 const max=a.order.length*a.cfg.pts;Object.assign(a,{c,w,o,score:r2(sc),max,pct:max?r2(Math.max(0,sc)/max*100):0,nota:max?r2(Math.max(0,sc)/max*20):0,status:'done',doneAt:Date.now()});return ks}
async function finish(force){const a=S.a;if(S.fin)return;const p=a.order.length-Object.keys(a.resp).length;
 if(!force&&!(await ask(p?'Tienes '+p+' pregunta'+(p>1?'s':'')+' sin responder. ¿Finalizar de todos modos?':'¿Finalizar el examen y ver tu resultado?','Finalizar')))return;
 S.fin=1;clearInterval(tick);
 try{const ks=await grade(a);S.km=ks;try{await DB.put('attempts',a)}catch{toast('Resultado calculado, pero no se pudo guardar en el historial')}S.rf='all';S.fin=0;await go('res')}
 catch(er){S.fin=0;toast('No se pudo finalizar. Inténtalo de nuevo.');startTick()}}
function dlg(h){return new Promise(res=>{const o=document.createElement('div');o.className='mo';o.setAttribute('role','dialog');o.innerHTML='<div class="md">'+h+'</div>';document.body.append(o);o.querySelector('input,textarea:not([readonly]),[data-r="1"]')?.focus();
 const close=v=>{o.remove();res(v)};o.addEventListener('click',ev=>{const b=ev.target.closest('[data-r]');if(b){const i=o.querySelector('input');close(b.dataset.r==='1'?(i?i.value:true):(i?null:false))}else if(ev.target===o)close(o.querySelector('input')?null:false)});
 o.addEventListener('keydown',ev=>{if(ev.key==='Escape')close(o.querySelector('input')?null:false);if(ev.key==='Enter'&&ev.target.tagName==='INPUT')o.querySelector('[data-r="1"]').click()})})}
const ask=(m,ok='Aceptar')=>dlg(`<p>${e(m)}</p><div class="row"><button class="btn" data-r="0">Cancelar</button><button class="btn p" data-r="1">${e(ok)}</button></div>`);
const askText=(m,v)=>dlg(`<p>${e(m)}</p><input value="${e(v||'')}" maxlength="80"><div class="row" style="margin-top:14px"><button class="btn" data-r="0">Cancelar</button><button class="btn p" data-r="1">Guardar</button></div>`);
const sv=()=>DB.put('attempts',S.a).catch(()=>toast('No se pudo guardar el progreso'));
const A={
demo:()=>installDemos(),
go:el=>go(el.dataset.v),theme:()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';d.dataset.theme=nx;try{localStorage.setItem('es-theme',nx)}catch{}},
vw:()=>{S.f.view=S.f.view==='grid'?'list':'grid';draw()},
cfg:async el=>{S.busy=0;await load();const id=el.dataset.id,n=(await DB.all('questions')).filter(q=>q.examId===id&&q.status==='valid').length;if(!n)return toast('Este examen no tiene preguntas validadas.');S.v='cfg';S.eid=id;S.nq=n;draw()},
begin:el=>begin(el.dataset.id),
resume:async el=>{await load();const a=S.atts.find(x=>x.id===el.dataset.id);await open_(a)},
sel:async el=>{const a=S.a,id=a.order[a.i];if(!a.cfg.chg&&a.resp[id])return toast('En este examen no se pueden cambiar las respuestas');a.resp[id]=[el.dataset.o];draw();sv();
 if(a.cfg.mode==='prac'){try{S.fb[id]=(await DB.get('keys',id)).correct;draw()}catch{}}},
nav:el=>{S.a.i+=+el.dataset.d;draw();sv()},jump:el=>{S.a.i=+el.dataset.i;draw();sv()},
mark:()=>{const a=S.a,id=a.order[a.i];a.marks[id]=!a.marks[id];draw();sv()},
finish:()=>finish(),rf:el=>{S.rf=el.dataset.k;draw()},
open:async el=>{await load();const a=S.atts.find(x=>x.id===el.dataset.id);const qs=(await DB.all('questions')).filter(q=>q.examId===a.examId);S.qm=Object.fromEntries(qs.map(q=>[q.id,q]));S.km=Object.fromEntries((await DB.all('keys')).map(k=>[k.id,k.correct]));S.a=a;S.rf='all';go('res')},
ren:async el=>{const x=S.exams.find(z=>z.id===el.dataset.id),n=await askText('Nuevo nombre del examen',x.title);if(n&&n.trim()){x.title=n.trim();await DB.put('exams',x);draw()}},
cat:async el=>{const x=S.exams.find(z=>z.id===el.dataset.id),n=await askText('Carpeta / categoría',x.category||'');if(n!==null){x.category=n.trim();await DB.put('exams',x);draw()}},
del:async el=>{const id=el.dataset.id,n=att(id).length;if(!(await ask('¿Eliminar este examen, sus preguntas y sus '+S.atts.filter(a=>a.examId===id).length+' intentos? No se puede deshacer.','Eliminar')))return;
 for(const q of(await DB.all('questions')).filter(q=>q.examId===id)){await DB.del('questions',q.id);await DB.del('keys',q.id)}for(const a of S.atts.filter(a=>a.examId===id))await DB.del('attempts',a.id);await DB.del('exams',id);await load();draw()},
rq:el=>{S.rv.qs.splice(+el.dataset.i,1);draw()},cancelrv:()=>{S.rv=S.queue.shift()||null;S.imp=[];draw()},saverv:async()=>{const p=S.rv.qs.filter(q=>q.status==='pending').length;if(!S.rv.qs.length)return toast('No hay preguntas');if(p&&!(await ask(p+' preguntas siguen sin respuesta validada y no se calificarán. ¿Guardar igualmente?','Guardar')))return;saveRv()},
backup:async()=>{const o={v:1};for(const s of DB.ST)o[s]=await DB.all(s);dl('examen-studio-backup.json',o)},
xres:()=>dl('resultados.json',{...S.a,det:S.a.det})};
function dl(n,o){const t=JSON.stringify(o,null,1);try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;a.click()}catch{}
 dlg(`<p><b>${e(n)}</b></p><p class="t2">Si la descarga no empezó, copia este texto y guárdalo en un archivo .json.</p><textarea readonly style="min-height:170px" onclick="this.select()">${e(t)}</textarea><div class="row" style="margin-top:14px"><button class="btn p" data-r="1">Cerrar</button></div>`)}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(el)A[el.dataset.act]?.(el)});
document.addEventListener('input',ev=>{const t=ev.target,f=t.dataset.f;if(!f)return;
 if(f==='q'){S.f.q=t.value;$('#lst').innerHTML=lst();return}if(f==='rs'){S.f.rs=t.value;$('#rk').innerHTML=rkBody();return}if(f==='rn'){S.rv.name=t.value;return}
 const q=S.rv?.qs[+t.dataset.i];if(!q)return;if(f==='s')q.statement=t.value;if(f==='o')q.options.find(o=>o.id===t.dataset.o).text=t.value});
document.addEventListener('change',async ev=>{const t=ev.target,f=t.dataset.f;
 if(t.id==='fi')return handleFiles([...t.files]);
 if(t.id==='bk'){try{const o=JSON.parse(await t.files[0].text());for(const s of DB.ST)for(const v of o[s]||[])await DB.put(s,v);toast('Copia importada');go('lib')}catch{toast('Copia de seguridad no válida')}return}
 if(f==='sort'){S.f.sort=t.value;$('#lst').innerHTML=lst()}if(f==='ex'){S.f.ex=t.value;draw()}if(f==='rx'||f==='rm'){S.f[f]=t.value;draw()}if(f==='rt'){S.f.rt=t.checked;draw()}
 const q=S.rv?.qs[+t.dataset.i];if(!q)return;
 if(f==='c'){q.correct=[t.value];if(q.status!=='excluded')q.status='valid'}if(f==='x')q.status=t.checked?'excluded':q.correct.length?'valid':'pending';
 if(f==='c'||f==='x'){$('#b'+t.dataset.i).textContent=bl(q);$('#b'+t.dataset.i).className='bd '+(q.status==='valid'?'ok':q.status==='pending'?'wn':'bad');$('#sm').innerHTML=sumRv()}});
document.addEventListener('dragover',ev=>{if($('#dz')){ev.preventDefault();$('#dz').classList.add('ov')}});
document.addEventListener('dragleave',()=>$('#dz')?.classList.remove('ov'));
document.addEventListener('drop',ev=>{if($('#dz')){ev.preventDefault();handleFiles([...ev.dataTransfer.files].filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name)))}});
try{const t=localStorage.getItem('es-theme');if(t)document.documentElement.dataset.theme=t}catch{}
DB.open().then(()=>go('dash')).catch(()=>app.innerHTML='<div class="card"><b>No se pudo abrir el almacenamiento local.</b><p>Desactiva el modo privado o permite el almacenamiento del sitio.</p></div>');
</script></body></html>
