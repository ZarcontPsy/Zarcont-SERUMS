<style>
/* ===== Examen Studio — Rediseño completo ===== */
:root{
  --font-display:'Sora','Open Sans',system-ui,sans-serif;
  --font-body:'Inter','Open Sans',system-ui,-apple-system,sans-serif;
  --brand:#df2531; --brand-2:#ff7a1a; --brand-deep:#a8121c;
  --brand-ink:#fff;
  --bg:#f7f3ef; --surface:#ffffff; --surface-2:#fff7f2;
  --ink:#1d1517; --muted:#7c6f70; --faint:#a89d9e;
  --border:rgba(29,21,23,.09); --border-strong:rgba(29,21,23,.16);
  --ok:#0e9f5d; --ok-bg:rgba(14,159,93,.12);
  --bad:#d51f2b; --bad-bg:rgba(213,37,49,.10);
  --warn:#b45309; --warn-bg:rgba(180,83,9,.12);
  --shadow-sm:0 1px 2px rgba(29,21,23,.06);
  --shadow-md:0 12px 32px -12px rgba(120,50,30,.18),0 2px 8px rgba(29,21,23,.06);
  --shadow-lg:0 24px 64px -16px rgba(120,30,30,.25),0 4px 16px rgba(29,21,23,.08);
  --r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:32px;
  --max:1080px;
  --glass:rgba(255,255,255,.82);
  --bg-fx:
    radial-gradient(600px 320px at 88% -4%,rgba(255,122,26,.22),transparent 60%),
    radial-gradient(700px 380px at 8% 12%,rgba(223,37,49,.14),transparent 60%),
    radial-gradient(800px 500px at 50% 110%,rgba(255,180,120,.18),transparent 60%),
    linear-gradient(180deg,#fdfbf8,#f7f3ef);
}
:root[data-theme="dark"]{
  --bg:#0d0b0c; --surface:#1a1516; --surface-2:#221b1d;
  --ink:#faf4f4; --muted:#c0adad; --faint:#8a7a7b;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
  --brand:#ff4653; --brand-2:#ff8a3d;
  --ok:#34d399; --ok-bg:rgba(52,211,153,.14);
  --bad:#ff7b84; --bad-bg:rgba(255,80,90,.14);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14);
  --glass:rgba(26,21,22,.78);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 16px 40px -12px rgba(0,0,0,.6);
  --shadow-lg:0 28px 70px -18px rgba(0,0,0,.7);
  --bg-fx:
    radial-gradient(700px 380px at 85% -5%,rgba(255,70,80,.20),transparent 60%),
    radial-gradient(700px 420px at 10% 10%,rgba(255,122,26,.10),transparent 60%),
    linear-gradient(180deg,#0d0b0c 0%,#1a1113 55%,#2a0e11 100%);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0b0c; --surface:#1a1516; --surface-2:#221b1d;
    --ink:#faf4f4; --muted:#c0adad; --faint:#8a7a7b;
    --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
    --brand:#ff4653; --brand-2:#ff8a3d;
    --ok:#34d399; --ok-bg:rgba(52,211,153,.14);
    --bad:#ff7b84; --bad-bg:rgba(255,80,90,.14);
    --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14);
    --glass:rgba(26,21,22,.78);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 16px 40px -12px rgba(0,0,0,.6);
    --shadow-lg:0 28px 70px -18px rgba(0,0,0,.7);
    --bg-fx:
      radial-gradient(700px 380px at 85% -5%,rgba(255,70,80,.20),transparent 60%),
      radial-gradient(700px 420px at 10% 10%,rgba(255,122,26,.10),transparent 60%),
      linear-gradient(180deg,#0d0b0c 0%,#1a1113 55%,#2a0e11 100%);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15.5px/1.6 var(--font-body);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;
}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg-fx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass);backdrop-filter:blur(18px);z-index:30}

/* ===== Header ===== */
nav{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:20;
  display:flex;gap:8px;align-items:center;
  margin:12px auto 0;max-width:var(--max);width:calc(100% - 24px);
  padding:8px 8px 8px 8px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--border);border-radius:999px;
  box-shadow:var(--shadow-md);
  overflow-x:auto;scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
.brand{
  display:flex;align-items:center;gap:10px;margin-right:auto;
  padding:6px 14px 6px 6px;white-space:nowrap;text-decoration:none;color:var(--ink);
}
.brand-mark{
  width:36px;height:36px;border-radius:12px;flex:none;
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 6px 18px rgba(223,37,49,.35);
}
.brand b{font:800 13px var(--font-display);letter-spacing:.18em;text-transform:uppercase}
.brand b i{color:var(--brand);font-style:normal}
nav .btn.s{border-color:transparent;background:transparent;font-weight:600;color:var(--muted)}
nav .btn.s:hover{color:var(--ink);background:rgba(127,100,100,.10);border-color:transparent;transform:none}
nav .btn.s.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav .btn.s:last-child{border:1px solid var(--border)}

/* ===== Layout / tipografía ===== */
main{max-width:var(--max);margin:0 auto;padding:28px 16px 90px;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
h1{
  font:800 clamp(28px,5vw,44px)/1.05 var(--font-display);
  letter-spacing:-.02em;margin:10px 0 10px;
}
h2{
  font:700 12px var(--font-body);letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);margin:32px 0 14px;display:flex;align-items:center;gap:10px;
}
h2::after{content:"";height:1px;flex:1;background:var(--border);border-radius:99px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font:700 11px var(--font-body);letter-spacing:.24em;text-transform:uppercase;
  color:var(--brand);background:var(--bad-bg);
  border:1px solid rgba(223,37,49,.18);
  padding:7px 14px;border-radius:999px;margin-bottom:6px;
}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.t2,.meta{color:var(--muted);font-size:13.5px}
.meta{margin-top:6px}
.hero-sub{font-size:16px;color:var(--muted);max-width:62ch;margin:0 0 18px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}

/* ===== Tarjetas ===== */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:22px;
  box-shadow:var(--shadow-sm);margin-bottom:14px;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.card:hover{border-color:var(--border-strong)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.grid .card{margin:0;display:flex;flex-direction:column}
.grid .card b{font:700 16px/1.4 var(--font-display);letter-spacing:-.01em}
.list{display:grid;gap:12px}
.list .card{margin:0}

/* Stats bento coherente */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stats .card{
  margin:0;min-width:0;overflow-wrap:anywhere;
  padding:18px;border-radius:20px;position:relative;overflow:hidden;
  background:var(--surface);color:var(--ink);
}
.stats .card::before{
  content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg,var(--brand),var(--brand-2));
  opacity:.9;
}
.stats .card:nth-child(3)::before{background:linear-gradient(90deg,var(--brand),var(--brand-deep))}
.stats b{font:800 30px/1 var(--font-display);display:block;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{display:block;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin-top:7px;color:var(--muted)}
.stats .card:nth-child(1){background:linear-gradient(135deg,var(--brand),#b31220);color:#fff;border-color:transparent}
.stats .card:nth-child(1) span{color:rgba(255,255,255,.85)}
.stats .card:nth-child(1)::before{display:none}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.stats .card:last-child:nth-child(odd){grid-column:1/-1}}

/* ===== Botones ===== */
.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:11px 20px;
  font:600 14.5px var(--font-body);cursor:pointer;
  transition:transform .16s,box-shadow .16s,background .16s,border-color .16s;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.p{
  background:linear-gradient(135deg,var(--brand) 0%,#c81e28 55%,#b31220 100%);
  color:#fff;border-color:transparent;
  box-shadow:0 10px 26px -8px rgba(223,37,49,.55),inset 0 1px 0 rgba(255,255,255,.22);
}
.btn.p:hover{box-shadow:0 14px 32px -8px rgba(223,37,49,.6);filter:brightness(1.04)}
.btn.p::after{
  content:'→';display:inline-grid;place-items:center;
  width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.22);font-size:15px;line-height:1;
}
.btn.s{padding:8px 15px;min-height:36px;font-size:13.5px}
.btn.s.p::after{display:none}
.btn.d{color:var(--bad);border-color:rgba(213,37,49,.25)}
.btn.d:hover{background:var(--bad-bg);border-color:var(--bad)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(223,37,49,.4);outline-offset:2px}

/* ===== Formularios ===== */
input,textarea,select{
  font:500 14.5px var(--font-body);color:var(--ink);
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:14px;padding:12px 15px;width:100%;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(223,37,49,.12);outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:76px;resize:vertical;line-height:1.55}
label.f{display:block;margin:14px 0;font-weight:600;font-size:14px}
label.f input[type=checkbox]{width:18px;height:18px;margin-right:10px;accent-color:var(--brand);vertical-align:-3px}
input[type=radio]{accent-color:var(--brand);width:20px;height:20px;flex:none;margin-top:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{margin-left:auto}
.bd{font-size:11px;font-weight:700;padding:5px 12px;border-radius:99px;border:1px solid var(--border);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.bd.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.bd.wn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.bd.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}

/* ===== Importar ===== */
.drop{
  border:2px dashed rgba(223,37,49,.35);border-radius:var(--r-xl);
  padding:52px 20px;text-align:center;background:var(--surface);
  box-shadow:var(--shadow-sm);transition:.2s;
}
.drop:hover{border-color:var(--brand)}
.drop.ov{background:var(--bad-bg);border-color:var(--brand);transform:scale(1.005)}
.drop p:first-child{font:700 18px var(--font-display);margin:0 0 6px}

/* ===== Examen ===== */
.q{font:600 clamp(17px,2.6vw,20px)/1.55 var(--font-body);margin:12px 0 18px;letter-spacing:-.01em;color:var(--ink)}
.opt{
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  margin:10px 0;padding:15px 17px;border-radius:var(--r-md);
  border:1.5px solid var(--border);background:var(--surface);color:var(--ink);
  font:500 15.5px/1.55 var(--font-body);cursor:pointer;transition:.16s;
}
button.opt:hover{border-color:var(--brand);transform:translateX(3px);box-shadow:var(--shadow-sm)}
.opt b{
  flex:none;width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(127,100,100,.12);color:var(--ink);
  font:700 13px var(--font-body);
}
.opt.on{border-color:var(--brand);background:var(--bad-bg);box-shadow:0 0 0 1.5px var(--brand)}
.opt.on b{background:var(--brand);color:#fff}
.opt.on::after{content:'✓';margin-left:auto;color:var(--brand);font-weight:800}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.good b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad b{background:var(--bad);color:#fff}
.bar{
  display:flex;align-items:center;gap:12px;
  padding:10px 10px 10px 20px;border-radius:20px;
  background:rgba(20,14,15,.92);color:#fff;margin-bottom:14px;
  box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(16px);position:sticky;top:76px;z-index:10;
}
.bar b{font:700 14px var(--font-display);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .btn{color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.16)}
.bar .btn:hover{background:rgba(255,255,255,.2)}
.bar .t2{color:#e8cfcf;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.10);padding:6px 12px;border-radius:99px}
.prog{height:10px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .35s ease}
.dock{
  position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px;
  padding:8px;border-radius:22px;display:flex;flex-wrap:wrap;
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--border);box-shadow:var(--shadow-md);z-index:5;gap:8px;
}
.dock .btn{padding:10px 16px;font-size:13.5px;flex:1;min-width:110px}
@media(max-width:480px){.dock .btn{padding:10px 8px;font-size:12.5px;min-width:0}}
.nums{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.nums button{
  width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--border);background:var(--surface);color:var(--ink);
  cursor:pointer;font:700 13px var(--font-body);transition:.15s;
}
.nums button:hover{border-color:var(--brand);transform:translateY(-1px)}
.nums .a{background:linear-gradient(135deg,var(--brand),#b31220);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(223,37,49,.35)}
.nums .m{box-shadow:0 0 0 3px var(--warn-bg);border-color:var(--warn)}
.nums .c{outline:2.5px solid var(--ink);outline-offset:2px}

/* ===== Resultados ===== */
.ring{
  width:148px;height:148px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--border) 0);
  box-shadow:var(--shadow-md);
}
.ring span{
  width:112px;height:112px;border-radius:50%;background:var(--surface);
  display:grid;place-items:center;font:800 27px var(--font-display);letter-spacing:-.02em;
}
.chart{display:flex;align-items:flex-end;gap:7px;height:130px;padding:12px 4px 0}
.chart i{flex:1;background:linear-gradient(180deg,var(--brand-2),var(--brand));border-radius:9px 9px 4px 4px;min-width:8px;min-height:4px;transition:height .3s}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:12px 8px;border-bottom:1px solid var(--border);font-size:14px}
th{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(223,37,49,.05)}
details{border:1px solid var(--border);border-radius:14px;padding:4px 14px;margin-top:12px;background:var(--surface-2)}
details summary{cursor:pointer;margin:10px 0;font-weight:600;font-size:13.5px;color:var(--muted)}
pre{margin:8px 0;font-size:13px;line-height:1.6}
.toast{
  position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:50%;
  transform:translateX(-50%);background:#171112;color:#fff;
  padding:13px 24px;border-radius:999px;z-index:60;animation:rise .25s;
  max-width:92vw;text-align:center;font-weight:600;font-size:14px;
  box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.12);
}
.mo{position:fixed;inset:0;background:rgba(15,8,9,.55);backdrop-filter:blur(10px);display:grid;place-items:center;z-index:50;padding:18px;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.md{background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:26px;max-width:480px;width:100%;box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto}
.md p{margin:0 0 18px;font-size:15px}
.md .row{justify-content:flex-end}
.glass{backdrop-filter:blur(14px)}
::selection{background:rgba(223,37,49,.22)}
:focus-visible{border-radius:8px}

/* Scrollbar sutil */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(130,100,100,.35);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* Footer */
.app-foot{max-width:var(--max);margin:0 auto;padding:0 18px 34px;color:var(--faint);font-size:12.5px;text-align:center}

</style></head><body>

<script>

/* ---------- Persistencia (IndexedDB) ---------- */

 el recién nacido"],["B.","Seguimiento de la gestante y promoción del parto"],["C.","El acceso a la población alto andina y amazónica"],["D.","Control del post parto en el establecimiento de salud"]],"C","alta"],["78",8,"El psicólogo en una capacitación a la comunidad promueve la participación del servicio de nutrición considerando el incremento de anemia; como afecta el desarrollo físico y psicológico del niño. ¿Cuál es el eje temático de la promoción de salud abordado?",[["A.","Desnutrición crónica"],["B.","Vida sana y productiva"],["C.","Alimentación y nutrición"],["D.","Actividad física"]],"C","alta"],["79",8,"En consulta psicológica de adolescente con problemas de autoestima, la usuaria refiere sangrado de encías, el psicólogo le pide bajar la mascarilla y observa encías inflamadas y placa dental. La deriva a odontología, pero las citas están distantes, por lo que procede a enseñarle la técnica de:",[["A.","Sesión demostrativa"],["B.","Destartraje gingival"],["C.","Cepillado e hilo dental"],["D.","Relajación y respiración"]],"C","alta"],["80",8,"El uso de los estadísticos tales como el Rho de Spearman, Pearson, y otros se determina por la Prueba de Normalidad en la etapa de:",[["A.","Análisis de datos"],["B.","Marco teórico"],["C.","Discusión y conclusiones"],["D.","Resultados PSICOLOGÍA"]],"A","alta"],["81",9,"Dentro de los principios ético-médicos pragmáticos. Informar ampliamente al paciente o sus representantes, la evolución del padecimiento, de acuerdo con la historia natural de la enfermedad, riesgos y posibles beneficios, para que el paciente pueda determinar en consecuencia. ¿Qué principio se aplica?",[["A.","Autonomía"],["B.","Confidencialidad"],["C.","Humanitarismo"],["D.","Veracidad"]],"A","alta"],["82",9,"Paciente con claros signos de violencia de género, referido al CSMC y el personal de salud le informa de manera clara y precisa que va a ser atendida por Medicina, Enfermería, Psicología y Psiquiatría, así como recibirá todos los procedimientos correspondientes a su caso; para lo cual es necesario solicitar:",[["A.","Carta de pertinencia cultural"],["B.","Consentimiento informado"],["C.","Decreto legal"],["D.","Carta informativa"]],"B","alta"],["83",9,"En una unidad ejecutora. ¿Qué oficina se encarga de coordinar, ejecutar y diseñar los programas de fortalecimiento de capacidades del capital humano?",[["A.","Organización y racionalización"],["B.","Planeamiento estratégico"],["C.","Desarrollo institucional"],["D.","Recursos humanos"]],"D","alta"],["84",9,"En un colegio de una comunidad campesina se reporta un brote de rubeola; como parte de su confirmación se recolecta información de los niños afectados y definir el caso; encontrándose signos y síntomas compatibles con la enfermedad, con evidencia epidemiológica definitiva de laboratorio de contacto. ¿A qué tipo de caso se refiere?",[["A.","Índice"],["B.","Probable"],["C.","Sospechoso"],["D.","Compatible"]],"B","alta"],["85",9,"El “consentimiento informado” es el primer indicador de mayor atención en la …… de investigación.",[["A.","discusión"],["B.","ética"],["C.","metodología"],["D.","interculturalidad"]],"B","alta"],["86",9,"Joven de 19 años, que por ciberbullying se ha provocado cutting, es llevada al CSMC por su madre. Al tamizaje de PHQ- 9 se determina episodio depresivo moderado (F32.1). La psicóloga junto al equipo multidisciplinario y consensuada con la paciente, brinda un conjunto de intervenciones de psicoterapia cognitivo conductual, manejo de pensamientos negativos, actividad física y recreativa; así como un plan de seguimiento. ¿Qué tipo de plan ha generado?",[["A.","Psicoterapia familiar"],["B.","Atención individualizado (PAI)"],["C.","Continuidad de cuidados (PCCI)"],["D.","Terapia cognitivo conductual"]],"B","alta"],["87",9,"En una comunidad, se produjo volcadura de camión que trasladaba insumos médicos, que incluía 1000 termómetros de mercurio. El personal de salud se apresura a prestar apoyo y tiene contacto con el metal. ¿Cuál es la acción inmediata que realiza el médico serumista?",[["A.","Determinar factores de riesgo ambiental"],["B.","Notificación epidemiológica"],["C.","Elaborar el plan de acción regional"],["D.","Lavado de manos al personal expuesto"]],"B","alta"],["88",9,"Mujer de 24 años, acude a un establecimiento de salud presentando náuseas y vómitos, la obstetra del establecimiento está a unos minutos de su horario de salida y decide atenderla sin registrar la atención. ¿Qué proceso técnico administrativo de la historia clínica se ve vulnerado?",[["A.","Conservación"],["B.","Confidencialidad y acceso"],["C.","Organización y manejo del archivo"],["D.","Apertura"]],"D","alta"],["89",9,"Gestante de 20 años, se presenta a consulta y refiere que consume marihuana y alcohol, indica que quiere dejar el consumo porque sabe que no le hace bien, pero las amigas le ofrecen y vuelve a consumir. El psicólogo después de realizar el tamizaje ASSIST, y la consejería en salud mental, iniciará su tratamiento a través de:",[["A.","Intervención motivacional"],["B.","Asociación libre"],["C.","Triada cognitiva conductual"],["D.","Modelo integrador"]],"A","alta"],["90",9,"Personal de un establecimiento de salud se reúne para analizar la situación actual de salud de su jurisdicción, para ello interpreta la pirámide poblacional, índices de mortalidad y morbilidad de manera estadística, comparando con el diagnóstico del año anterior. ¿Qué les faltó incluir?",[["A.","Incluir a especialistas locales"],["B.","Considerar las noticias locales"],["C.","Participación comunitaria"],["D.","Participación de la red PSICOLOGÍA"]],"C","alta"],["91",10,"¿Cómo se le llama al proceso mediante el cual los ciudadanos participan responsablemente en la definición, aplicación de las políticas relativas al ambiente y sus componentes, el proceso de toma de decisiones públicas sobre materias ambientales, así como su ejecución y fiscalización?",[["A.","Manejo de los residuos sólidos"],["B.","Política nacional del ambiente"],["C.","Promoción de la gestión territorial"],["D.","Participación ciudadana ambiental"]],"D","alta"],["92",10,"¿Qué es lo que se debe solicitar y consignar en la historia clínica antes de la atención a un menor de edad para garantizar la admisión integral en salud?",[["A.","Boleta de pago en caja"],["B.","Datos del padre o apoderado"],["C.","Financiamiento de la prestación"],["D.","Motivo de consulta"]],"B","alta"],["93",10,"El psicólogo del centro de salud mental comunitario recibe una referencia de su colega de la zona sanitaria, mediante el cual, después de su valoración clínica, difiere con el diagnóstico inicial de la referencia. Después de la atención, el psicólogo de la zona sanitaria empieza a recibir burlas de parte del personal del centro de salud mental comunitario, a partir del comentario del colega. ¿Qué falta ética se está cometiendo?",[["A.","Imparcialidad del trato"],["B.","Competencia desleal"],["C.","Trato entre colegas"],["D.","Críticas entre colegas"]],"D","alta"],["94",10,"Si un paciente asiste a consulta por psicología, de acuerdo a la norma técnica de salud para la atención integral del adolescente; el psicólogo después de la consulta deberá asegurarse que el usuario sea atendido por las especialidades de obstetricia, nutrición, odontología; según:",[["A.","Los estilos de vida saludables"],["B.","Los factores protectores"],["C.","El paquete de atención"],["D.","La necesidad de salud"]],"C","alta"],["95",10,"La ...... implica que un cambio en una variable es responsable, directa o indirectamente, de un cambio observado en otra variable.",[["A.","asociación"],["B.","causalidad"],["C.","relación"],["D.","exposición"]],"B","alta"],["96",10,"El consultorio de psicología necesita adquirir pruebas psicológicas para mejorar la atención de sus pacientes, para lo cual el jefe del establecimiento hace su requerimiento y sus términos de referencia. Según la normatividad vigente de contrataciones del estado. ¿Cómo se le denomina al responsable del establecimiento?",[["A.","Titular de la entidad"],["B.","Área técnica"],["C.","Órgano encargado de contrataciones"],["D.","Área usuaria"]],"D","alta"],["97",10,"¿Cómo se llama el sistema encargado de ofrecer la garantía necesaria para aplicar los descuentos y sanciones en el marco de los dispositivos legales para la permanencia del personal?",[["A.","Reglamento interno de servidores"],["B.","Procedimiento administrativo disciplinario"],["C.","Manual de operaciones"],["D.","Control de asistencia"]],"D","alta"],["98",10,"¿Cuál es la técnica de la terapia cognitiva conductual, que se emplea en trastorno de estrés post traumático para afrontar el trauma y mejorar la adaptación social en casos de violación?",[["A.","Desensibilización sistemática"],["B.","Escucha activa"],["C.","Asociación libre"],["D.","Entrenamiento en habilidades sociales"]],"A","alta"],["99",10,"Adolescente de 14 años llega acompañada de su madre, la que manifiesta: “Todos los días, mi hija llega del colegio con dolores de cabeza, con ganas de llorar y se pone a dormir toda la tarde; la hemos llevado a la curandera y ha dicho que es mal de ojo y siempre tenemos que pasarle el huevo para que no siga así; desde que ha tenido una discusión con su compañera está así”. El psicólogo considera incluir dentro del plan de tratamiento dicha acción mientras trabaja con pensamientos y habilidades sociales. Esto es un ejemplo de:",[["A.","Diálogo intercultural"],["B.","Medicina alternativa"],["C.","Medicina tradicional"],["D.","Interculturalidad en salud"]],"D","alta"],["100",10,"Durante la atención psicológica a niña de 4 años en compañía de la madre, el profesional psicólogo observa en el rostro de ambas, señales compatibles de sarampión. ¿Cuál es el procedimiento a seguir?",[["A.","Evaluar la eficacia de control"],["B.","Realizar la ficha de referencia"],["C.","Comunicar al responsable de epidemiología"],["D.","Programar seguimiento del brote"]],"C","alta"]]},{"n":"SERUMS 2026 - I PSICOLOGIA · 19 de abril 2026","f":"8053031-005-psicologia.pdf","h":"10810281ca8f5eab2a73e93a4817d2689da2e6c3a5077cd45c65c544a0d053b4","p":10,"q":[["1",1,"En una consulta psicológica donde se brinda psicoeducación sobre la vacunación contra el virus de papiloma humano, para prevenir infecciones por los diferentes tipos de VPH. ¿Qué tipo de prevención se realiza?",[["A.","Inmediata"],["B.","Secundaria"],["C.","Terciaria"],["D.","Primaria"]],"D","alta"],["2",1,"El Serumista que forma parte del equipo multidisciplinario en una investigación, debe priorizar el cuidado de los alcances de la investigación, el cuidado de los participantes y el cuidado de la vida, utilizando debidamente el consentimiento informado, los instrumentos y protocolos según el tipo de investigación, con atención del respeto por la diversidad, las culturas, y la humanización en su actuación. Esto hace referencia a:",[["A.","Respeto de estándares en la investigación"],["B.","Prohibición del plagio en la investigación"],["C.","Responsabilidad científica y presentación de resultados"],["D.","Investigación y respeto de normas y principios"]],"A","alta"],["3",1,"Varón de 63 años, con diagnostico B 24, con tratamiento desde que estuvo privado de libertad, actualmente en libertad, acude por retrovirales al establecimiento I-3. ¿Qué debe hacer el proveedor de salud que atiende?",[["A.","Indicarle que debe apersonarse con algún familiar para darle información"],["B.","Brindar confidencialidad, indicar hospital de derivación para recibir retrovirales"],["C.","Custodiar sus cosas personales e institucionales y mantener distancias"],["D.","Constatar si tiene SIS, para entregarle retrovirales correspondientes"]],"B","alta"],["4",1,"Si la interacción entre un paciente y el personal sanitario tratante, se da mediante uso de las TICs. ¿Qué concepto de salud se está aplicando?",[["A.","Promoviendo salud"],["B.","Cuidado integral"],["C.","Salud intercultural"],["D.","Telesalud"]],"D","alta"],["5",1,"El conjunto de procedimientos asistenciales a través del cual se asegura la continuidad de la atención de las necesidades de salud de los usuarios, transfiriéndolo del establecimiento de menor a mayor capacidad resolutiva, corresponde a:",[["A.","Contrarreferencia"],["B.","Atención compartida"],["C.","Referencia"],["D.","Atención primaria"]],"C","alta"],["6",1,"Niño de 8 años se presenta a la consulta psicológica, luego del tamizaje en NNA se agenda su atención al taller de habilidades sociales. De acuerdo con el paquete del cuidado integral de salud del niño. ¿Qué cuidados se está desarrollando?",[["A.","Naturales"],["B.","Individuales"],["C.","Familiares"],["D.","Comunitarios"]],"B","alta"],["7",1,"Paciente migrante gestante quechua hablante, tiene derecho a …… para parto vertical.",[["A.","acompañamiento de familia"],["B.","traductor de idioma original"],["C.","presencia solo de pareja"],["D.","servicios de salud con adecuación cultural"]],"D","alta"],["8",1,"Durante la atención integral de la gestante, los controles prenatales buscan detectar riesgos para eliminarlos o minimizarlos. ¿Qué tipo de prevención es?",[["A.","Cuaternaria"],["B.","Secundaria"],["C.","Terciaria"],["D.","Primaria"]],"D","alta"],["9",1,"Al realizar un trabajo de investigación sobre higiene bucal, el investigador brinda los cepillos dentales a unos y a otros que ellos mismos se los compren. ¿Qué principio ético básico está siendo vulnerado?",[["A.","Respeto"],["B.","Maleficencia"],["C.","Justicia"],["D.","Autonomía"]],"C","alta"],["10",1,"Para estimar el cálculo del número de individuos necesario para realizar un estudio de investigación transversal, es imprescindible conocer la variabilidad del parámetro que se desea estimar basado en datos propios, de otras investigaciones o de un estudio piloto a través de la varianza. ¿Cuál es el enfoque del estudio?",[["A.","Cualitativo"],["B.","Cuantitativo"],["C.","Mixto"],["D.","Prospectivo PSICOLOGIA"]],"B","alta"],["11",2,"¿Cuál es la relación de alianza psicólogo - paciente, que establece una colaboración, compenetración en el proceso de la atención psicológica?",[["A.","Exceso de curiosidad"],["B.","Empatía"],["C.","Romper el hielo"],["D.","Rapport"]],"D","alta"],["12",2,"Mujer víctima de violencia sexual, presenta secuelas emocionales como estrés post traumático; después de la información brindada por la psicóloga del centro de salud, la paciente decide no realizar la denuncia contra su agresor. ¿Cuál es la conducta a seguir?",[["A.","Derivar a medicina para su atención"],["B.","Continuar con la atención en el centro de salud"],["C.","Notificar al CEM y referir al CSMC"],["D.","Referir al CSMC y no notificar"]],"C","alta"],["13",2,"Se observa que hay migrantes de selva que viven en un asentamiento humano de un distrito de Lima, que son discriminados y rechazados entre los pobladores del distrito donde pernoctan, por lo que se debe …",[["A.","reforzar la interacción cultural."],["B.","cambiar hábitos, costumbres y creencias."],["C.","imponer acciones socio educativas."],["D.","normalizar el comportamiento de la comunidad."]],"A","alta"],["14",2,"En el establecimiento de salud al paciente adulto se le brinda el consentimiento informado, donde se le explica en forma clara los procedimientos que se le realizará. ¿Qué aspectos éticos se está respetando?",[["A.","Justicia"],["B.","Beneficencia"],["C.","Autonomía"],["D.","Maleficencia"]],"C","alta"],["15",2,"En una comunidad amazónica se registra un brote de malaria por Plasmodium falciparum , donde dos niños fallecieron de un total de 50 pacientes (4%) confirmados con gota gruesa y PCR. ¿Cuál es la medida epidemiológica de frecuencia referida?",[["A.","Tasa de letalidad"],["B.","Incidencia acumulada"],["C.","Tasa de ataque"],["D.","Tasa de mortalidad general"]],"A","alta"],["16",2,"Cuando un equipo de trabajo se reúne para mejorar la calidad de sus actividades asistenciales, genera su misión, visión y valores que deben ser compartidos por todos; se está generando una:",[["A.","Cultura organizacional"],["B.","Calidad de servicios"],["C.","Mejora continua"],["D.","Capacidad resolutiva"]],"A","alta"],["17",2,"En la comunidad a un paciente que vive con VIH se le ha seleccionado y capacitado para que brinde apoyo emocional, educación en salud y acompañamiento a otros pacientes de igual condición para la prevención de la transmisión y atención integral de las ITS/VIH. Esto corresponde a:",[["A.","Agente comunitario de salud"],["B.","Educadores pares"],["C.","Paciente elegido"],["D.","Comunal"]],"B","alta"],["18",2,"Dentro del paquete integral de salud del adulto mujer. ¿Qué atenciones preventivas se realizan?",[["A.","Identificación de síndrome de maltrato"],["B.","Atención de violencia familiar"],["C.","Tratamiento de algún daño prevalente"],["D.","Despistaje de Sífilis, VIH/SIDA, cáncer de cérvix"]],"D","alta"],["19",2,"El responsable de la RIS desea saber la cantidad de atenciones realizadas por el médico serumista en consulta externa. ¿Qué indicador de gestión debe utilizar?",[["A.","Concentración"],["B.","Permanencia"],["C.","Productividad"],["D.","Rendimiento"]],"C","alta"],["20",2,"Adolescente de 13 años, con 38 semanas de gestación, migrante de los andes, sin control, indica relaciones sexuales han sido voluntaria con ex pareja de 35 años, viene acompañada de madre al establecimiento I-3. ¿Cuál es la conducta a seguir?",[["A.","Aplicar kits completos de emergencia para descarte de ITS, VIH, Hepatitis B"],["B.","Brindar actividades socio educativas a fin de que paciente identifique riesgos"],["C.","Responsabilizar a sus progenitores por negligencia hacia la paciente."],["D.","Comunicar a las autoridades, como código violeta y referencia hospitalaria PSICOLOGIA"]],"D","alta"],["21",3,"¿Cuál es la ciencia que investiga la distribución y magnitud de los fenómenos patológicos, la forma en que varían entre las diferentes poblaciones y circunstancias con las que se asocian?",[["A.","Salud Publica"],["B.","Tanatología"],["C.","Antropología"],["D.","Epidemiologia"]],"D","alta"],["22",3,"Usted aca e la salud"],["C.","Familias saludables"],["D.","Entornos saludables"]],"B","alta"],["87",9,"¿Cuál es el plazo en días, que tiene el establecimiento de salud, para entregar la copia de la historia clínica o Epicrisis, solicitada por el paciente o usuario de acuerdo al marco legal?",[["A.","15"],["B.","10"],["C.","5"],["D.","30"]],"C","alta"],["88",9,"Paciente de 52 años con problemas de consumo de tabaco y mala alimentación, acude a consulta con dificultades para respirar, dolor de pecho, nervioso, asustado. Si continua con su misma calidad de vida. ¿Qué problemas de salud está propenso a padecer?",[["A.","Infecciones respiratorias"],["B.","Diabetes mellitus tipo 1"],["C.","Neurológicos"],["D.","Cardiovasculares"]],"D","alta"],["89",9,"Las bolsas de recolección de residuos sólidos se deben diferenciar por colores: residuos biocontaminados:......, residuos químicos:...... y residuos comunes:...",[["A.","rojo / negro / amarillo."],["B.","negro / amarillo / rojo."],["C.","amarillo / rojo / negro."],["D.","rojo / amarillo / negro."]],"D","alta"],["90",9,"Se realiza la visita a un niño con anemia, se le orienta a la madre darle alimentos ricos en hierro como la sangrecita. La madre señal que su religión no le permite. ¿Cuál es la conducta más adecuada para mejorar el estado de salud del menor?",[["A.","Llamarle la atención por negligencia y desidia"],["B.","Respetar la decisión y creencia de la familia"],["C.","Fortalecer el consumo de hierro intradomiciliario"],["D.","Obligar a que la madre lo alimente con la sangrecita"]],"C","alta"],["91",9,"En una comunidad campesina altoandina se está presentando alto índice de enfermedades infecciosas. ¿Qué actividad de promoción de la salud se implementaría de inmediato?",[["A.","Lavado de manos"],["B.","Campaña de vacunación"],["C.","Calzado de guantes"],["D.","Cuidado del agua"]],"A","alta"],["92",9,"El análisis de los datos depende al menos de los siguientes factores: el nivel de medición de las variables, el diseño de investigación utilizado y el ...",[["A.","tipo de hipótesis formulada."],["B.","diseño de los objetivos."],["C.","estadístico utilizado."],["D.","resultado hallado."]],"A","alta"],["93",9,"Para garantizar el adecuado desempeño de los recursos humanos de su establecimiento de salud. ¿Qué se debe considerar?",[["A.","Virtudes"],["B.","Competencias"],["C.","Valores"],["D.","Caracteres"]],"B","alta"],["94",9,"¿Con qué se determina el número de la historia clínica de una persona de nacionalidad peruana?",[["A.","Pasaporte"],["B.","Según número de ingreso"],["C.","Carnet de extranjería"],["D.","Documento Nacional de Identidad PSICOLOGIA"]],"D","alta"],["95",10,"Los pobladores de una comunidad ashaninka llegan al centro de salud preocupados debido a que sus niños presentan dolor y diarrea con mucha frecuencia. Además, refieren que tomaron preparados de hierbas y posteriormente algunos fallecieron. ¿Cuál es la función de salud pública que debe fortalecer el personal de salud?",[["A.","Valoración del estado de salud"],["B.","Vigilancia y valoración del estado de salud"],["C.","Vigilancia y valoración por el laboratorio"],["D.","Valoración clínica y laboratorio"]],"B","alta"],["96",10,"En un centro de salud I-4, el nuevo médico jefe ha reestructurado el rol central de esta institución, la población objetivo asignada y los atributos de la entidad. Esta construcción de elementos se denomina:",[["A.","Indicador"],["B.","Objetivo"],["C.","Visión"],["D.","Misión"]],"D","alta"],["97",10,"Paciente de 25 años esperando su atención en el centro de salud; el personal lo llama por su apellido y le menciona “Ud. debe alimentarse mejor por su TBC” frente a los usuarios que se encuentran en la sala de espera. ¿Qué derecho del paciente se está vulnerando?",[["A.","Privacidad"],["B.","Confidencialidad"],["C.","Autonomía"],["D.","Transparencia"]],"B","alta"],["98",10,"En la atención de varón de 25 años, el Psicólogo evidencia falta de atención y concentración, distorsiones en sus pensamientos, negación de maltrato psicológico, cambios en su memoria, entre otros, que afecta su toma de decisiones. ¿Qué dimensión está afectada?",[["A.","Cognitiva"],["B.","Afectiva"],["C.","Pareja"],["D.","Social"]],"A","alta"],["99",10,"¿A qué se hace referencia cuando se habla del conjunto de creencias, costumbres y valores de una organización?",[["A.","Organización laboral"],["B.","Clima organizacional"],["C.","Sistema de salud"],["D.","Cultura organizacional"]],"D","alta"],["100",10,"El modelo del cuidado integral por curso de vida acoge atributos de la atención primaria; cuando incluye intervenciones individuales basadas en evidencia, incluyendo intervenciones familiares y comunitarios. ¿A que componente corresponde?",[["A.","Financiamiento"],["B.","Gestión"],["C.","Organización"],["D.","Prestación"]],"D","alta"]]},{"n":"(SERUMS) - MINSA PSICOLOGIA - I · 24 de agosto 2025","f":"7084225-psicologia.pdf","h":"606f5257bd4833404808afec3505f57ea4d3283cd1e9887949118e10a3a1378d","p":13,"q":[["1",1,"El equipo multidisciplinario en salud va a realizar una campaña de salud integral en una comunidad indígena; a la hora del almuerzo, la psicóloga recibe el alimento preparado por la población, más no lo ingiere haciendo gestos de disgusto de la comida recibida. A partir de la fecha, la población ya no desea que vaya la psicóloga a atenderlos, mucho menos dejarse atender por ella en el establecimiento de salud. Esta situación forma parte de una …… de la comunicación.",[["A.","estrategia"],["B.","barrera"],["C.","habilidad"],["D.","forma"]],"B","alta"],["2",1,"¿Cuál es el documento médico legal, que registra en forma unificada, personal, multimedia, refrendada con la firma digital del médico u otros profesionales de la salud, cuyo tratamiento (registro, almacenamiento, actualización, acceso y uso) se realiza en estrictas condiciones de seguridad, integralidad, autenticidad, confidencialidad, exactitud, inteligibilidad, conservación y disponibilidad a través de un sistema de información?",[["A.","Historia clínica electrónica"],["B.","Ficha familiar informatizada"],["C.","Historia clínica informatizada"],["D.","Ficha electrónica de atención"]],"A","alta"],["3",1,"Personal de salud acude a reunirse con el concejo municipal a fin de sustentar la importancia de contar con una ordenanza municipal, para la mejora de los quioscos que venden comidas chatarras en las instituciones educativas, a fin de ofrecer alimentos saludables. Finalmente, después de un debate, el concejo municipal aprobó dicha ordenanza, debiendo ser aplicado al día siguiente de su publicación. ¿Cómo se llama esta estrategia de promoción de la salud?",[["A.","Abogacía y políticas públicas"],["B.","Empoderamiento local"],["C.","Participación ciudadana"],["D.","Comunicación y educación para la salud"]],"A","alta"],["4",1,"Cuando los servicios de salud llegan a la población, previo diálogo entre los prestadores y usuarios, para acordar las características de los servicios de acuerdo a los parámetros culturales, se denomina:",[["A.","Diálogo comunal"],["B.","Pertinencia intercultural"],["C.","Diálogo social"],["D.","Participación social"]],"B","alta"],["5",1,"El Seguro Integral de Salud garantiza como mínimo el 70% de su presupuesto destinado al Ministerio de Salud y a las unidades ejecutoras de los gobiernos regionales para los componentes de reposición, siendo indispensable la compra de los insumos, productos farmacéuticos y sanitarios esenciales para los asegurados a nivel nacional. ¿A qué función esencial de salud pública (FESP) renovada pertenece dicha acción?",[["A.","Financiamiento de la salud eficiente y equitativo"],["B.","Asegurar el acceso y el uso racional de medicamentos y otras tecnologías"],["C.","Gestión y promoción de las intervenciones sobre los determinantes sociales de la salud"],["D.","Acceso equitativo a intervenciones que buscan promover la salud"]],"B","alta"],["6",1,"En el sector salud para el cuidado integral de salud en el curso de vida, se enfoca en las determinantes sociales que comprenden: determinantes intermedios y...",[["A.","complejos."],["B.","ambientales."],["C.","estructurales."],["D.","sectoriales."]],"C","alta"],["7",1,"Durante la atención psicológica a niño de 5 años, se observa poco participativo, se apoya en el escritorio, bosteza, presenta talla baja y contextura delgada, pálido; se observa la historia clínica y registra bajo peso. Se procede a derivar para cumplir con el...",[["A.","taller de habilidades sociales."],["B.","programa de alimentación."],["C.","cuidado integral del niño."],["D.","taller de autoestima. PSICOLOGIA - I"]],"C","alta"],["8",2,"En la gestión de calidad, la auditoría …… lo realiza el propio establecimiento, mientras cuando lo hace una instancia superior, sea otra IPRESS o comité especial, se denomina auditoría…",[["A.","externa / dirimente."],["B.","propia / general."],["C.","simple / especializada."],["D.","interna / externa."]],"D","alta"],["9",2,"¿Cuáles son las pruebas rápidas de elección para el tamizaje en los servicios de atención prenatal, salas de parto, emergencias obstétricas y puerperio?",[["A.","ELISA"],["B.","Pruebas rápidas (PR)"],["C.","Inmunoensayo en línea"],["D.","Pruebas rápidas duales (PRD)"]],"D","alta"],["10",2,"Este tipo de prevención puede lograrse con la promoción de la salud y con la protección específica, el cual se logra con medidas educativas, económicas y sociales, por lo tanto, no está desvinculada de los diferentes sectores de la economía y de la realidad sociocultural de una comunidad en particular. ¿A qué nivel de prevención hace referencia el enunciado?",[["A.","Secundaria"],["B.","Terciaria"],["C.","Primaria"],["D.","Cuaternaria"]],"C","alta"],["11",2,"Es la capacidad de mantener a la organización productiva, eficiente y eficaz, a partir del uso adecuado de su recurso humano, cuyo objetivo son las personas y sus relaciones en la organización creando un clima favorable de trabajo, desarrollando las habilidades y capacidad de los trabajadores, permitiendo el desarrollo individual y organizacional sostenido. ¿A qué corresponde este enunciado?",[["A.","Gestión"],["B.","Evaluación"],["C.","Administración"],["D.","Planeación"]],"A","alta"],["12",2,"En muchos casos este mundo puede y tiene caminos de diálogo con la ciencia moderna, como en la implementación de servicios de salud con pertinencia intercultural para la atención del parto los cuales incorporan, por ejemplo, el …… o el uso de plantas medic inales.",[["A.","internamiento"],["B.","parto vertical"],["C.","parto convencional"],["D.","aborto"]],"B","alta"],["13",2,"El terremoto de Rusia de 8.2, generó una alerta de tsunami en todo el litoral peruano; ante ello, las autoridades tomaron medidas preventivas de alerta. ¿Qué tipo de amenaza es dicho suceso?",[["A.","Mixto"],["B.","Híbrido"],["C.","Antropogénico"],["D.","Natural"]],"D","alta"],["14",2,"Mujer de 15 años llega a consulta mostrando síntomas de bajo peso, delgadez evidente, dificultad para comer, amenorrea y pensamientos recurrentes sobre su imagen corporal. ¿Cuáles son los pasos a seguir frente a este caso?",[["A.","Entrevistar - observar - evaluar"],["B.","Observar - entrevistar - diagnosticar"],["C.","Aplicar pruebas - interpretar - informar"],["D.","Evaluar - observar - entrevistar"]],"A","alta"],["15",2,"¿Cómo se denomina a la ausencia, prevención o minimización del daño producido en el proceso de la atención sanitaria?",[["A.","Calidad de atención"],["B.","Seguridad del paciente"],["C.","Accesibilidad a los servicios"],["D.","Adecuación de los sistemas PSICOLOGIA - I"]],"B","alta"],["16",3,"El proceso que permite describir y analizar la situación con respecto al estado de salud y sus determinantes sociales en una población de un espacio geográfico claramente definido, con el fin de identificar necesidades y establecer prioridades en salud. Corresponde al:",[["A.","Análisis situacional"],["B.","Control epidemiológico"],["C.","Enfoque transversal"],["D.","Modelo comunitario"]],"A","alta"],["17",3,"Varón de 30 años, preocupado, ansioso, pide una atención por obstetricia manifestando haber visitado un prostíbulo la semana anterior; cree haberse picado el preservativo y haber contraído el VIH. El personal de salud se acerca, inmediatamente le aplica la prueba rápida, siendo el resultado negativo; le da el resultado y recomienda tener mayor cuidado y asegurarse del uso correcto del preservativo, así como el tener pareja estable. Según normativa. ¿Qué paso de la consejería obvió?",[["A.","Salud mental"],["B.","Postest"],["C.","Reducción de riesgos"],["D.","Pretest"]],"D","alta"],["18",3,"El equipo de psicología del EE.SS. realiza campaña de salud mental en las instituciones educativas de la comunidad de su jurisdicción. ¿Qué actividad de prioridad en salud pública está realizando?",[["A.","Defensa de la salud"],["B.","Restauración de la salud"],["C.","Promoción de la salud"],["D.","Cuidado de la salud"]],"C","alta"],["19",3,"En el establecimiento de salud, el psicólogo toma conocimiento del riesgo de un brote; de acuerdo al flujograma de notificación de riesgo. ¿A quién informa para que se realice la notificación correspondiente?",[["A.","Secretaria del establecimiento"],["B.","Personal de admisión"],["C.","Al responsable de vigilancia epidemiológica"],["D.","Jefe de guardia del establecimiento"]],"C","alta"],["20",3,"¿Cuál es el nivel de prevención que tiene como objetivo evitar la ocurrencia de los factores de riesgo o determinantes en una población?",[["A.","Cuaternaria"],["B.","Terciaria"],["C.","Secundaria"],["D.","Primaria"]],"D","alta"],["21",3,"En el establecimiento de salud, como parte del equipo de protección personal para la consulta externa en psicología que tiene contacto directo con los pacientes por la entrevista cara a cara es importante el uso de:",[["A.","Protector respiratorio según el riesgo"],["B.","Protección ocular"],["C.","Guantes quirúrgicos"],["D.","Protección de calzado"]],"A","alta"],["22",3,"Varón de 38 años viene acompañado por su hermano para pasar atención en establecimiento de salud, solicitando referencia para iniciar tratamiento en salud mental por una presunta psicosis. Personal de salud verifica que paciente se encuentra en malas condiciones de aseo y vestimenta, negándose a atenderlo hasta que regrese mejor vestido y aseado. ¿Qué derecho se le está negando?",[["A.","Recibir la medicación correspondiente"],["B.","Recibir información sobre los servicios"],["C.","Otorgar su consentimiento informado"],["D.","A no ser discriminado o estigmatizado"]],"D","alta"],["23",3,"Ante tantos casos de cáncer de cuello uterino, mama, colon, próstata, estómago, linfoma y leucemias se ha implementado el …… que incluye las políticas públicas sobre aseguramiento universal de salud, descentralización, fortalecimiento del primer nivel de atención y la reforma de salud.",[["A.","Club de paliativos"],["B.","Juntos por el cáncer"],["C.","Plan esperanza"],["D.","Club oncológico PSICOLOGIA - I"]],"C","alta"],["24",4,"La investigación …… hace uso de test estandarizados con buena validez y confiabilidad, así como contrasta sus hipótesis.",[["A.","cuantitativa"],["B.","mixta"],["C.","cualitativa"],["D.","correlacional"]],"A","alta"],["25",4,"Una de las actividades de la vigilancia en salud ocupacional es implementar la ...... y …… del factor de riesgo, que incluyan actividades de educación.",[["A.","estrategia - eliminación"],["B.","identificación - ejecución"],["C.","Intervención – eje"],["D.","promoción - prevención"]],"D","alta"],["26",4,"El código de ética de la función pública prescribe ocho principios: respeto, probidad, eficiencia, idoneidad, ……, lealtad y obediencia, justicia y equidad, así como lealtad al estado de derecho.",[["A.","compromiso"],["B.","puntualidad"],["C.","progreso"],["D.","veracidad"]],"D","alta"],["27",4,"La …… tiene un papel importante en la difusión de conocimientos, modificaciones o reforzamientos de conductas, normas sociales y valores que contribuyen al mejoramiento de la calidad de vida.",[["A.","Gestión en salud"],["B.","Vigilancia epidemiológica"],["C.","Planificación en salud"],["D.","Comunicación en salud"]],"D","alta"],["28",4,"Está centrado en las personas, familias y comunidades, actúa con la participación protagónica y efectiva de éstas, desde la planificación hasta la evaluación de los procesos implementados para la promoción y protección de la salud mental y para los cuidados de la salud de las personas, familias y colectividades con problemas psicosociales y/o trastornos mentales en cada territorio. ¿A qué modelo corresponde?",[["A.","Atención integral de salud"],["B.","Hogares protegidos"],["C.","Salud mental comunitario"],["D.","Plan esperanza"]],"C","alta"],["29",4,"El equipo multidisciplinario del establecimiento de salud, acuerda efectuar actividades relacionadas con: alimentación y nutrición saludable; higiene y ambiente; actividad física; salud mental; salud sexual y reproductiva. Este acuerdo implica que se están abordando los…",[["A.","escenarios."],["B.","programas de intervención."],["C.","ejes temáticos."],["D.","enfoques transversales."]],"C","alta"],["30",4,"En la atención psicológica a mujer de 30 años, el ambiente del consultorio de psicología es compartido por dos profesionales, separado por un biombo. ¿Qué aspecto de la entrevista no se cumple?",[["A.","Uso del espacio físico"],["B.","Control en la atención"],["C.","Manejo del tiempo"],["D.","Duración de la entrevista"]],"A","alta"],["31",4,"Se tiene que impartir una terapia de familia a un niño que ha presentado miedos nocturnos por sus pensamientos de muerte; su padre está laborando en la mina y para lograr su participación. ¿Qué eje de la telesalud se debe brindar para la atención?",[["A.","Telegestión"],["B.","Telemonitoreo"],["C.","Teleconsulta"],["D.","Teleinterconsulta"]],"C","alta"],["32",4,"Al psicólogo se le solicita trabajar el clima organizacional del establecimiento de salud. La adecuación de la encuesta, así como la preparación técnica de la medición del clima organizacional, forman parte de la fase de…",[["A.","evaluación."],["B.","seguimiento."],["C.","planificación."],["D.","intervención. PSICOLOGIA - I"]],"C","alta"],["33",5,"Los pacientes con problemas de salud mental como: alcoholismo, farmacodependencia, trastornos psiquiátricos y violencia familiar que es responsabilidad primaria de la familia y del estado; tienen derecho a:",[["A.","Recuperación, rehabilitación y promoción de su salud mental"],["B.","Orientación, consejería y tratamiento"],["C.","Promoción de su salud mental, consejería y tratamiento"],["D.","Rehabilitación, consejería y tratamiento"]],"A","alta"],["34",5,"¿Cuál es el sistema que, “tiene como principio el integrar en forma técnica -asistencial-administrativo, las capacidades resolutivas existentes en la oferta de los servicios de los niveles locales, regionales y nacionales que el problema o necesidad de salu d requiere para lograr la satisfacción del usuario como un derecho a la vida”?",[["A.","De vigilancia epidemiológica"],["B.","De referencia y contrarreferencia"],["C.","De seguro integral de salud"],["D.","De referencia comunal"]],"B","alta"],["35",5,"En la consulta psicológica, mujer de 56 años quechua hablante se presenta a consulta; la psicóloga considera la presencia de un familiar o persona de confianza, que sirva de traductor para facilitar la atención. ¿Qué enfoque de salud se está aplicando?",[["A.","De socialización"],["B.","Intercultural"],["C.","Cultural"],["D.","De alfabetización"]],"B","alta"],["36",5,"Las costumbres, las preferencias, los gustos, los vestidos, formas y estilos de arte, creencias, tabúes y prohibiciones; son manifestaciones de:",[["A.","Patrones culturales"],["B.","Deontología profesional"],["C.","Medicina tradicional"],["D.","Interculturalidad"]],"A","alta"],["37",5,"¿A qué fase del plan de salud local se articulan los planes operativos anuales de la municipalidad, de la Red de Salud y de la DIRESA?",[["A.","Planeamiento estratégico participativo de salud"],["B.","Programación de salud local"],["C.","Evaluación de las necesidades de la localidad"],["D.","Seguimiento de los resultados de la ejecución"]],"B","alta"],["38",5,"Todo servidor público debe ...… y ...… los bienes del Estado, debiendo utilizar los que le fueran asignados para el desempeño de sus funciones de manera racional, evitando su abuso, derroche o desaprovechamiento, sin emplear o permitir que otros empleen los bienes del Estado para fines particulares o propósitos que no sean aquellos para los cuales hubieran sido específicamente destinados.",[["A.","atesorar / utilizar"],["B.","proteger / conservar"],["C.","ejecutar / depositar"],["D.","usar / cuidar"]],"B","alta"],["39",5,"Varón de 9 años es derivado por la institución educativa por tener problemas de conducta; viene acompañado de sus padres, quienes refieren un cambio en la figura paterna, el cual empezó a ausentarse del hogar hace medio año, incumpliendo los acuerdos que tenían desde un inicio como pareja. ¿Qué terapia es más eficiente en este contexto?",[["A.","Terapia familiar"],["B.","Psicoanálisis"],["C.","Terapia conductual"],["D.","Terapia cognitiva"]],"A","alta"],["40",5,"Mujer de 29 años, de 6 meses de gestación, asiste a psicología derivado de obstetricia con tamizaje positivo en violencia, con valoración de riesgo leve. ¿Qué debe hacer el psicólogo del EESS?",[["A.","Referir para manejo hospitalario"],["B.","Continuar con la atención en el establecimiento de salud"],["C.","Derivar al centro de salud mental comunitario"],["D.","Inscribirla en el taller de agresores PSICOLOGIA - I"]],"B","alta"],["41",6,"En el 2026 el Centro de Salud \"Chosica\" será líder en la atención primaria en salud con calidad, calidez, equidad y eficiencia, logrando usuarios internos y externos satisfechos para conseguir estilos de vida saludables. Esto constituye la ...... de la institución.",[["A.","meta"],["B.","visión"],["C.","estrategia"],["D.","misión"]],"B","alta"],["42",6,"En el EESS el personal adquiere una reacción adversa a la presencia de un agente infeccioso que le produce una infección ocupacional, estamos hablando de:",[["A.","Reacción de estrés laboral"],["B.","Enfermedad infecciosa"],["C.","Infección asociada a la atención de salud"],["D.","Enfermedad ocupacional"]],"C","alta"],["43",6,"En la fase de diagnóstico y fijación de prioridad, para elaborar un programa de salud mental comunitaria, se tienen espacios que facilitan la escucha de las necesidades de:",[["A.","La comunidad"],["B.","La municipalidad"],["C.","Los beneficiarios"],["D.","Su gobierno regional"]],"A","alta"],["44",6,"Mujer de 15 años, viene acompañada de su madre; presenta ansiedad y está faltando al colegio. Solicita ser atendida por psicología; en admisión le indican que primero debe ingresar al paquete de cuidado integral de salud del adolescente según el flujo de atención. ¿Qué acción se debe realizar?",[["A.","Derivar a centro especializado"],["B.","Respetar la atención que solicita"],["C.","Iniciar la atención por obstetricia"],["D.","Seguir el flujo de atención"]],"B","alta"],["45",6,"La realización de las asistencias técnicas, supervisión y capacitación para la mejora de las intervenciones clínicas en los establecimientos de salud no especializados en temas de salud mental; es una de las actividades de:",[["A.","Instituto nacional de salud mental"],["B.","Coordinación de salud mental de la DIRESA"],["C.","Coordinación de salud mental de la RIS"],["D.","Centro de salud mental comunitario"]],"D","alta"],["46",6,"Se reúne el equipo multidisciplinario de epidemiología, en el cual verifican datos estadísticos, geográficos, eventos o daños en salud para tomar decisiones de interés en una determinada población. ¿Cómo se llama este documento?",[["A.","Análisis situacional de salud"],["B.","Plan estratégico institucional"],["C.","Plan de salud local"],["D.","Plan operativo institucional"]],"A","alta"],["47",6,"Mujer de 70 años, se acerca al establecimiento de salud I-3, para ser atendida por el médico de turno, como parte de la atención obligatoria para el programa pensión 65, siendo su primera atención en el año; se da con la sorpresa que el médico no se encuentra debido a que el profesional llevó una referencia en ambulancia. Según el paquete de cuidado integral de salud del adulto mayor. ¿Qué debe hacer el psicólogo capacitado con la paciente a fin de no perder la oportunidad de atención?",[["A.","Atenderla aplicando el VACAM corto"],["B.","Reprogramar para una atención por el médico"],["C.","Citarla para el día siguiente"],["D.","Hacer una referencia a otro establecimiento"]],"A","alta"],["48",6,"El psicólogo prepara los indicadores de acción estratégica institucional para lograr la prevención, detección precoz y atención integral por curso de vida, de problemas de salud mental tomando proporción de personas detectadas con trastornos afectivos ¿Cuál es la condición principal que deben tener estos indicadores?",[["A.","Diagnóstico e inicio de tratamiento"],["B.","Diagnóstico sin tratamiento"],["C.","Sólo diagnóstico"],["D.","Sólo tratamiento PSICOLOGIA - I"]],"A","alta"],["49",7,"Varón de 40 años, solicita informe psicológico para su trabajo. Los resultados de la evaluación no son aptos para el puesto, por lo que ofrece soborno al psicólogo, para que el informe le sea favorable. ¿Qué falta a la ética en la función pública comete el psicólogo si acepta soborno?",[["A.","Idoneidad"],["B.","Obediencia"],["C.","Veracidad"],["D.","Probidad"]],"D","alta"],["50",7,"La exposición a riesgos psicosociales como carga mental, jornada de trabajo, contenido de la tarea, relaciones interpersonales, seguridad contractual, en el ambiente de trabajo por periodos prolongados (años), están asociados a …… para desarrollar alguna e nfermedad no transmisible como por ejemplo la diabetes.",[["A.","respiración de Kussmaul"],["B.","trastorno mental"],["C.","síndrome metabólico"],["D.","cetoacidosis diabética"]],"C","alta"],["51",7,"¿Qué condición, repercute en la salud pública en varias dimensiones, las cuales ocasionan perjuicio en el desarrollo de la educación, salud y cultura del Perú, trayendo consigo las siguientes consecuencias: baja esperanza de vida, delincuencia, violencia extrema, desintegración familiar y otros?",[["A.","El trabajo infantil"],["B.","La pobreza"],["C.","El aumento de alcoholismo"],["D.","La desintegración familiar"]],"B","alta"],["52",7,"Mujer de 54 años, muestra cambios psicológicos: depresión, ansiedad, irritabilidad, insomnio, dificultad para la concentración, falta de energía, sentimientos negativos frente a la pérdida de la capacidad reproductiva, creerse menos femenina o menos deseada, conlleva al detrimento de la confianza en sí misma; lo que le produce...",[["A.","negación a su etapa de vida."],["B.","necesidad de ser atendida por un varón."],["C.","complejo de inferioridad sexual."],["D.","irritabilidad exacerbada compleja."]],"C","alta"],["53",7,"Mujer de 19 años, acude a consulta y refiere pensamientos automáticos negativos sobre morir, alteración del sueño, disminución de sentir placer, pérdida de apetito; el psicólogo aplica el …… para determinar su nivel de depresión.",[["A.","GDS-15"],["B.","PHQ-9"],["C.","M-CHAT"],["D.","SRQ"]],"B","alta"],["54",7,"Convertir la entrevista diagnóstica en una larga lista de preguntas de diagnóstico, hace que la entrevista se vuelva mecánica y disminuya …… con el paciente.",[["A.","la conversación"],["B.","la continuidad"],["C.","el tema principal"],["D.","el rapport"]],"D","alta"],["55",7,"Mientras que la investigación …… explica una mayor comprensión de un fenómeno a través de la recolección intensiva de datos narrativos, la investigación …… predice y/o controla un fenómeno a través de la recolección de datos numéricos.",[["A.","cualitativa - cuantitativa"],["B.","correlacional - cuantitativa"],["C.","cualitativa - correlacional"],["D.","cuantitativa - cualitativa"]],"A","alta"],["56",7,"Hábitos de chupar o morder lápices, crayolas u otros, uso de productos químicos sin registro sanitario, manipulación de juguetes y útiles de escritorio sin registro, ni autorización sanitaria, uso de utensilios de comida (cerámica vidriada); son factores d e riesgo de exposición a…",[["A.","excrementos."],["B.","metales pesados."],["C.","pinturas."],["D.","plaguicidas. PSICOLOGIA - I"]],"B","alta"],["57",8,"El …… es un instrumento de gestión que comprende la programación de actividades operativas e inversiones de todas las dependencias del Ministerio de Salud, con sus respectivas metas físicas y financieras que esperan alcanzar en el año fiscal.",[["A.","Plan de prevención en salud"],["B.","Manual de funciones"],["C.","Modelo de salud"],["D.","Plan operativo institucional"]],"D","alta"],["58",8,"La atención integral de salud de la y el joven, permite evaluar su estado de salud, identificando precozmente los factores y conductas de riesgo, así como los problemas de salud, para intervenir en forma oportuna e integral, fomentando además conductas protectoras con enfoques de:",[["A.","Bienestar, aceptación y responsabilidad"],["B.","Deberes, consideración y aceptación"],["C.","Derechos, equidad de género e interculturalidad"],["D.","Criterios éticos, moralidad e identidad"]],"C","alta"],["59",8,"\"Es el estudio de cómo se distribuyen las enfermedades en las poblaciones y los factores que determinan o influyen en esta distribución\". Esta definición corresponde a:",[["A.","Estadística"],["B.","Salud pública"],["C.","Epidemiología"],["D.","Informática"]],"C","alta"],["60",8,"En el marco del ciclo de planeamiento estratégico la fase ...... es la encargada del diseño de objetivos y acciones estratégicas sectoriales en consistencia, alineamiento y coherencia con la definición de objetivos.",[["A.","3"],["B.","1"],["C.","4"],["D.","2"]],"A","alta"],["61",8,"En la atención psicológica a mujer de 22 años, el psicólogo al identificar la vulnerabilidad, necesidad afectiva y transferencia psicológica de la paciente, la invita a cenar, llegando a besos y tocamientos indebidos. ¿Qué tipo de ética no está respetando el psicólogo?",[["A.","Aplicada"],["B.","Pública"],["C.","Integral"],["D.","De protección"]],"A","alta"],["62",8,"¿A qué corresponde, la contaminación socio-cultural y psicosocial como la violencia y el estrés que se vive en nuestro medio ambiente?",[["A.","Idiosincrasia cultural"],["B.","Discriminación cultural"],["C.","Determinante social de la salud"],["D.","Estilo de vida generacional"]],"C","alta"],["63",8,"¿Cuál es la organización que presta o hace los arreglos institucionales para prestar una cartera de servicios de salud equitativa e integral a una población definida a través de la articulación, coordinación y complementación; y rinde cuentas por los resultados sanitarios y administrativos y por el estado de salud de la población a la que sirve?",[["A.","Establecimiento de salud"],["B.","Seguro integral de salud"],["C.","Red integrada de salud"],["D.","CLAS"]],"C","alta"],["64",8,"Mujer de 35 años, es derivada por CEM con riesgo moderado en violencia familiar, para recibir su tratamiento psicológico. El psicólogo empieza la entrevista preguntando sobre el hecho violento padecido generándole recuerdos y emociones guardadas. ¿Cómo se le denomina a este suceso?",[["A.","Victimización secundaria"],["B.","Tamizaje en violencia"],["C.","Primera ayuda psicológica"],["D.","Psicoterapia"]],"A","alta"],["65",8,"RHUS es la abreviatura de:",[["A.","Recurso humano en salud"],["B.","Recurso homogéneo útil en salud"],["C.","Relación humana sanitaria"],["D.","Reacción homogénea saludable PSICOLOGIA - I"]],"A","alta"],["66",9,"En el centro de salud, durante la atención psicológica a un niño de 5 años, se identifica acoso escolar por compañeros del aula, por lo que no quiere ir al colegio. La psicóloga articula con la institución educativa, para realizar la intervención en el aul a. A esto se denomina cuidado integral…",[["A.","individual."],["B.","sectorial."],["C.","comunitario."],["D.","familiar."]],"C","alta"],["67",9,"En una provincia del Perú, se atendió el parto a mujer de 30 años, la psicóloga que atiende, consulta a la paciente si desea que la placenta se les entregue a los familiares. De acuerdo al enfoque intercultural en salud. ¿Qué permite mejorar?",[["A.","Medicina tradicional"],["B.","Su recuperación"],["C.","El acceso a centros comunales"],["D.","El acceso a los servicios de salud"]],"D","alta"],["68",9,"¿Qué enfoque transversal de la promoción de la salud está relacionada con la práctica social concreta en que profesionales y usuarios interactúan a fin de escoger y tomar decisiones en relación a su salud, considerando valores éticos de justicia, solidaridad y equidad; actuando como educadores con otros (individuo, grupo y comunidad)?",[["A.","Participación comunitaria"],["B.","Capacitación comunitaria"],["C.","Comunicación en salud"],["D.","Educación para la salud"]],"D","alta"],["69",9,"¿Qué formato para la historia clínica dentro del modelo de cuidado integral, se utiliza en la consulta externa de la IPRESS del primer nivel de atención con población asignada?",[["A.","Por etapa de vida"],["B.","Por emergencia"],["C.","Sectorizados"],["D.","Diagnósticos"]],"A","alta"],["70",9,"En un establecimiento de salud, los valores, prácticas compartidas, líderes, normas y comunicación; son elementos de…",[["A.","clima organizacional."],["B.","directiva organizacional."],["C.","visión organizacional."],["D.","la cultura organizacional."]],"D","alta"],["71",9,"¿En qué escenario el psicólogo se encarga de orientar los casos de violencia u otras situaciones de riesgo, así como brindar soporte y apoyo para la derivación y seguimiento de estudiantes a establecimientos de salud y otros, en acuerdo con los directivos?",[["A.","Centro laboral"],["B.","Centro de emergencia mujer"],["C.","Escuela"],["D.","Comunidad"]],"C","alta"],["72",9,"Niño de 7 años, vive solo con su hermano de 15 años, porque ambos padres han fallecido. Los vecinos han escuchado que lloran, no se les ha visto comer y están mucho tiempo en la calle. El equipo de prevención y control de problemas y trastornos de salud mental los han identificado a través de las coordinaciones con:",[["A.","DEMUNA-Orfelinato-Calle"],["B.","EESS-Vecinos-CEM"],["C.","Organizaciones comunitarias-INABIF-CSMC"],["D.","Iglesia-ONG-Hogares protegidos"]],"C","alta"],["73",9,"En el ámbito educativo se observa a un niño con las siguientes características clínicas: palidez, insomnio, irritabilidad y disminución de la tolerancia al ejercicio. ¿Cuál es el diagnóstico?",[["A.","Depresión"],["B.","Desnutrición"],["C.","Poca tolerancia a la frustración"],["D.","Anemia PSICOLOGIA - I"]],"D","alta"],["74",10,"En un establecimiento de salud de Chaclacayo, el director realiza desplazamiento del personal a otro centro, sustentando la disminución de atenciones de parto, la obstetra que labora más de 10 años, manifiesta su descontento presentando una queja a recursos humanos. ¿Qué aspecto de la gestión de recursos humanos se ve afectado?",[["A.","Ley del CAS"],["B.","Trabajo social"],["C.","Salud mental"],["D.","Clima organizacional"]],"D","alta"],["75",10,"El MINSA en el ejercicio de su rol rector y de conducción estratégica del Sistema de Salud ha priorizado 08 objetivos estratégicos institucionales, los cuales están enfocados principalmente en:",[["A.","Vigilancia comunitaria"],["B.","La meritocracia de I.E.P."],["C.","Garantizar la salud de la población"],["D.","Realizar coordinaciones internacionales"]],"C","alta"],["76",10,"El código de ética del psicólogo, en el capítulo del tratamiento de los usuarios. El psicólogo debe rechazar toda orden o disposición que obliguen a contravenir las normas de la ética y …… profesional.",[["A.","compromiso"],["B.","función"],["C.","deontología"],["D.","competencia"]],"C","alta"],["77",10,"Varón de 49 años, acude al servicio de psicología, durante la entrevista refiere que su negocio y familia se están viendo afectado por su consumo de alcohol, afirma haber intentado dejar el c
