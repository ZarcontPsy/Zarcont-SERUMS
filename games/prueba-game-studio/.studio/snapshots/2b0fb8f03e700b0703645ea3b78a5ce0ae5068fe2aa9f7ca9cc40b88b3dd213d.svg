<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Glowing paper lantern. Flat cartoon, dark outline. -->
  <!-- Soft glow -->
  <circle cx="128" cy="142" r="84" fill="#ffd66b" opacity="0.28"/>
  <circle cx="128" cy="142" r="60" fill="#ffc94d" opacity="0.4"/>
  <!-- Hanging string -->
  <line x1="128" y1="16" x2="128" y2="46" stroke="#2b1b12" stroke-width="8" stroke-linecap="round"/>
  <!-- Top cap -->
  <rect x="92" y="44" width="72" height="18" rx="8" fill="#e85d3d" stroke="#2b1b12" stroke-width="8"/>
  <!-- Ribs -->
  <path d="M112 60c0 42 16 68 16 94" fill="none" stroke="#d98a2b" stroke-width="6"/>
  <path d="M144 60c0 42-16 68-16 94" fill="none" stroke="#d98a2b" stroke-width="6"/>
  <path d="M128 60v96" fill="none" stroke="#d98a2b" stroke-width="6"/>
  <!-- Lantern body -->
  <path d="M88 62c0 54 18 84 40 84s40-30 40-84c0-6-8-12-20-12h-40c-12 0-20 6-20 12z" fill="#ffc94d" stroke="#2b1b12" stroke-width="8"/>
  <path d="M88 66h80" stroke="#2b1b12" stroke-width="8" stroke-linecap="round"/>
  <path d="M92 146c0 8 8 12 14 12h44c6 0 14-4 14-12" fill="none" stroke="#2b1b12" stroke-width="8" stroke-linecap="round"/>
  <!-- Bottom cap -->
  <rect x="94" y="150" width="68" height="16" rx="8" fill="#e85d3d" stroke="#2b1b12" stroke-width="8"/>
  <!-- Tassel -->
  <line x1="128" y1="166" x2="128" y2="192" stroke="#e85d3d" stroke-width="8" stroke-linecap="round"/>
  <path d="M120 192c4 12 12 12 16 0z" fill="#e85d3d" stroke="#2b1b12" stroke-width="6" stroke-linejoin="round"/>
  <!-- Inner glow -->
  <ellipse cx="128" cy="116" rx="22" ry="30" fill="#fff3c4" opacity="0.9"/>
</svg>
