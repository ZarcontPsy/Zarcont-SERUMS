<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive · SERUMS QUEST</title>
<style>
  :root { color-scheme: dark; --bg:#07080c; --panel:#10131c; --line:rgba(255,255,255,.1); --text:#f4f6fb; --muted:#858da2; --blue:#7aa2ff; --green:#5fd3a0; --red:#f07178; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.5 Inter, system-ui, sans-serif; }
  .wrap { padding:20px; }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:-.03em; }
  p { margin:0; color:var(--muted); font-size:11px; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; margin:14px 0; }
  button { padding:7px 11px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; font-size:11px; cursor:pointer; }
  button.on { border-color:rgba(122,162,255,.45); background:rgba(122,162,255,.12); color:var(--blue); }
  .stage { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; padding:10px; border:1px dashed var(--line); border-radius:14px; background:rgba(255,255,255,.02); }
  iframe { border:1px solid var(--line); border-radius:12px; background:#07080c; box-shadow:0 20px 60px -30px #000; transition:width .2s ease, height .2s ease; }
  .result { margin-top:12px; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:6px; }
  .row { border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:10.5px; color:var(--muted); }
  .row b { color:var(--text); }
  .ok { color:var(--green); }
  .bad { color:var(--red); }
  h2 { font-size:13px; margin:18px 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Comprobación responsive</h1>
  <p>Los iframes cambian el viewport real: las media queries se evalúan con su ancho. Incluye Game Home, navegación inferior y selector de héroes.</p>
  <div class="bar">
    <button data-w="390" class="on">390 × 844</button>
    <button data-w="768">768 × 900</button>
    <button data-w="1280">1280 × 900</button>
  </div>
  <div class="stage">
    <iframe id="frame" src="../index.html#/" width="390" height="844" title="Inicio en viewport de prueba"></iframe>
    <iframe id="chars" src="../index.html#/personajes" width="390" height="844" title="Personajes en viewport móvil"></iframe>
  </div>
  <h2>Game Home</h2>
  <div class="result" id="result"></div>
  <h2>Selector de héroes (390 px)</h2>
  <div class="result" id="charsResult"></div>
</div>
<script>
  var frame = document.getElementById("frame");
  var chars = document.getElementById("chars");
  function row(label, value, ok) {
    return '<div class="row">' + label + ': <b class="' + (ok ? "ok" : "bad") + '">' + value + "</b></div>";
  }
  function checkHome() {
    var w = frame.contentWindow;
    var d = frame.contentDocument;
    if (!w || !d || !d.querySelector(".q-hero-stage")) return;
    var inner = d.documentElement.clientWidth;
    var overflow = d.documentElement.scrollWidth - inner;
    var hero = w.getComputedStyle(d.querySelector(".q-hero-stage"));
    var nav = w.getComputedStyle(d.querySelector(".q-nav"));
    var bottom = w.getComputedStyle(d.querySelector(".q-bottomnav"));
    var bottomLinks = d.querySelectorAll(".q-bottomlink").length;
    var homeBottom = d.querySelector(".q-home-bottom");
    var figure = d.querySelector(".q-hero-figure");
    var figureHeight = figure ? Math.round(figure.getBoundingClientRect().height) : 0;
    document.getElementById("result").innerHTML = [
      row("Viewport interno", inner + " px", true),
      row("Sin desbordamiento horizontal", overflow <= 1 ? "OK (" + overflow + "px)" : "FALLA (" + overflow + "px)", overflow <= 1),
      row("Hero en una columna (≤900)", hero.gridTemplateColumns.split(" ").length === 1 ? "sí" : hero.gridTemplateColumns, hero.gridTemplateColumns.split(" ").length === 1),
      row("Nav superior oculto en móvil", nav.display, nav.display === "none"),
      row("Navegación inferior visible", bottom.display + " · " + bottomLinks + " enlaces", bottom.display === "flex" && bottomLinks === 5),
      row("Home en una columna", homeBottom ? w.getComputedStyle(homeBottom).gridTemplateColumns.split(" ").length + " col" : "—", homeBottom ? w.getComputedStyle(homeBottom).gridTemplateColumns.split(" ").length === 1 : false),
      row("Personaje visible", figureHeight + " px", figureHeight >= 300)
    ].join("");
  }
  function checkCharacters() {
    var w = chars.contentWindow;
    var d = chars.contentDocument;
    if (!w || !d || !d.querySelector(".q-heroes-arena")) return;
    var inner = d.documentElement.clientWidth;
    var overflow = d.documentElement.scrollWidth - inner;
    var arena = w.getComputedStyle(d.querySelector(".q-heroes-arena"));
    var stage = d.querySelector(".q-heroes-stage");
    var strip = d.querySelector(".q-heroes-strip");
    var buttons = d.querySelectorAll("[data-action='char-prev'], [data-action='char-next']");
    var card = d.querySelector(".q-strip-card");
    var detail = d.querySelector(".q-heroes-detail");
    var detailStyle = detail ? w.getComputedStyle(detail) : null;
    document.getElementById("charsResult").innerHTML = [
      row("Viewport interno", inner + " px", true),
      row("Sin desbordamiento horizontal", overflow <= 1 ? "OK (" + overflow + "px)" : "FALLA (" + overflow + "px)", overflow <= 1),
      row("Arena en una columna (≤900)", arena.gridTemplateColumns.split(" ").length === 1 ? "sí" : arena.gridTemplateColumns, arena.gridTemplateColumns.split(" ").length === 1),
      row("Escenario del héroe", stage ? Math.round(stage.getBoundingClientRect().height) + " px" : "—", !!stage && stage.getBoundingClientRect().height >= 400),
      row("Botones anterior/siguiente", String(buttons.length), buttons.length === 2),
      row("Tira de héroes deslizable", strip ? w.getComputedStyle(strip).overflowX : "—", strip ? (w.getComputedStyle(strip).overflowX === "auto" || w.getComputedStyle(strip).overflowX === "scroll") : false),
      row("Tarjeta visible", card ? Math.round(card.getBoundingClientRect().width) + " px" : "—", !!card && card.getBoundingClientRect().width > 90),
      row("Detalle en una columna", detailStyle ? detailStyle.display : "—", detailStyle ? detailStyle.display === "flex" : false)
    ].join("");
  }
  function checkDesktop() {
    var w = frame.contentWindow;
    var d = frame.contentDocument;
    if (!w || !d || !d.querySelector(".q-hero-stage")) return;
    var nav = w.getComputedStyle(d.querySelector(".q-nav"));
    var bottom = w.getComputedStyle(d.querySelector(".q-bottomnav"));
    document.getElementById("result").innerHTML += row("1280 px · nav superior", nav.display, nav.display === "flex") +
      row("1280 px · nav inferior oculta", bottom.display, bottom.display === "none");
  }
  document.querySelectorAll("[data-w]").forEach(function (button) {
    button.addEventListener("click", function () {
      document.querySelectorAll("[data-w]").forEach(function (b) { b.classList.remove("on"); });
      button.classList.add("on");
      var width = Number(button.getAttribute("data-w"));
      frame.style.width = width + "px";
      frame.setAttribute("width", width);
      frame.style.height = (width <= 390 ? 844 : 900) + "px";
      frame.setAttribute("height", width <= 390 ? 844 : 900);
      setTimeout(function () { checkHome(); if (width >= 1280) checkDesktop(); }, 450);
    });
  });
  frame.addEventListener("load", function () { setTimeout(checkHome, 1000); });
  chars.addEventListener("load", function () { setTimeout(checkCharacters, 1300); });
</script>
</body>
</html>
