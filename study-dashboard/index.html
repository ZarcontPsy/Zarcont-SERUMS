<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B0B0D">
<script>
  try {
    var studyTheme = localStorage.getItem("study-theme") === "light" ? "light" : "dark";
    document.documentElement.dataset.theme = studyTheme;
    if (studyTheme === "light") {
      var studyMeta = document.querySelector('meta[name="theme-color"]');
      if (studyMeta) studyMeta.setAttribute("content", "#F3F0E8");
    }
  } catch (e) {}
</script>
<meta name="description" content="Study Dashboard: organiza el temario, lee fichas resumidas y sigue tu progreso real.">
<title>Study Dashboard · SERUMS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0a'/%3E%3Crect x='11' y='13' width='18' height='38' rx='7' fill='%23E6B566'/%3E%3Crect x='35' y='13' width='18' height='38' rx='7' fill='%23F2F2F2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Zen+Dots&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../study-shared/base.css?v=2.0.2">
<link rel="stylesheet" href="styles.css?v=2.2.2">
<link rel="stylesheet" href="../serums-chrome.css?v=1.0.0">
<link rel="stylesheet" href="../serums-mobile.css?v=1.0.0">
</head>
<body class="app-study app-dashboard">
<a class="s-skip" href="#main">Saltar al contenido</a>

<header class="s-appbar">
  <div class="s-appbar-inner">
    <a class="s-brand" href="#/" data-nav aria-label="Study Dashboard, inicio">
      <span class="s-brand-mark" data-icon="book" data-size="17"></span>
      <span class="s-brand-copy">
        <span class="s-brand-name">SERUMS STUDY</span>
        <span class="s-product-name">Dashboard de estudio</span>
      </span>
    </a>

    <nav class="s-nav" aria-label="Navegación principal">
      <a class="s-navlink" href="#/" data-nav data-route="home" aria-label="Panel">
        <span data-icon="grid" data-size="15"></span><span>Panel</span>
      </a>
      <a class="s-navlink" href="#/biblioteca" data-nav data-route="library" aria-label="Biblioteca">
        <span data-icon="book" data-size="15"></span><span>Biblioteca</span>
      </a>
      <a class="s-navlink" href="#/progreso" data-nav data-route="progress" aria-label="Progreso">
        <span data-icon="chart" data-size="15"></span><span>Progreso</span>
      </a>
    </nav>

    <div class="s-appbar-actions">
      <a class="s-btn s-btn--soft s-btn--sm dash-cross" href="../study-flashcards/index.html" aria-label="Abrir Study Flashcards">
        <span data-icon="cards" data-size="15"></span><span>Flashcards</span>
      </a>
      <span data-chrome-mount></span>
      <button class="s-iconbtn" type="button" data-theme-toggle aria-label="Cambiar tema"></button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <div id="boot" class="s-page dash-boot" aria-live="polite">
    <div class="dash-skeleton-hero s-skeleton"></div>
    <div class="dash-skeleton-row">
      <div class="s-skeleton s-skeleton--card"></div>
      <div class="s-skeleton s-skeleton--card"></div>
      <div class="s-skeleton s-skeleton--card"></div>
    </div>
    <span class="s-sr-only">Cargando Study Dashboard…</span>
  </div>
  <div id="view-root" class="s-page" hidden></div>
</main>

<div id="live" class="s-sr-only" aria-live="polite"></div>

<footer class="dash-footer">
  <div class="s-page dash-footer-inner">
    <span>Study Dashboard · progreso guardado en este navegador</span>
    <span class="dash-footer-links">
      <a href="../study-flashcards/index.html">Study Flashcards</a>
      <a href="../index.html">HUB</a>
    </span>
  </div>
</footer>

<script src="../study-data/temario.js?v=2.5.0"></script>
<script src="../study-shared/taxonomy.js?v=1.0.0"></script>
<script src="../study-shared/icons.js?v=2.0.1"></script>
<script src="../study-shared/ui.js?v=2.0.1"></script>
<script src="../study-shared/store.js?v=2.0.1"></script>
<script src="../serums-chrome.js?v=1.0.0"></script>
<script>
  window.SerumsChrome.mount(".s-appbar-actions [data-chrome-mount]", {
    homeHref: "#/",
    appName: "Study Dashboard",
    buttonClass: "s-iconbtn",
    fullscreen: true,
    order: ["home", "hub", "fullscreen"]
  });
</script>
<script src="app.js?v=2.2.1"></script>
</body>
</html>
