    <path d="M35 80c9 5 15 5 24 0" fill="none" stroke="url(#brass)" stroke-width="4"/>
    <circle cx="60" cy="54" r="7" fill="url(#brass)"/>
    <path d="M34 139l7-17 6 17M80 139l4-17 5 17" fill="#9fb9ff" opacity=".85"/>
    <path d="M60 41V27M52 33h16" stroke="#7aa2ff" stroke-width="2" filter="url(#glowBlue)"/>
    <path d="M91 48h20v26H91z" fill="none" stroke="#7aa2ff" stroke-width="1.5" opacity=".6"/>
    <path d="M98 56h7M98 63h11" stroke="#7aa2ff" stroke-width="1.5" opacity=".7"/>
