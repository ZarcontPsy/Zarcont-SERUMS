    <path d="M55 45h10v25H55zM50 70h20l5 30H45l5-30z" fill="#46345f" stroke="#d8c3f4" stroke-width="2"/>
    <path d="M54 78h12v16H54z" fill="#e6d4ff" filter="url(#glowWarm)"/>
    <path d="M47 100h26M52 105h16M60 36v-7" stroke="#c49bff" stroke-width="2"/>
    <path d="M87 55l6 6M94 44l4 2" stroke="#f2e8ff" stroke-width="2" opacity=".7"/>
