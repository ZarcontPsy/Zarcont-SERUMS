  <g opacity=".9">
    <rect x="10" y="15" width="1260" height="226" rx="18" fill="rgba(8,12,21,.22)" stroke="rgba(207,222,255,.1)"/>
    <path d="M28 105H52M28 115H42" stroke="#69d3c1" stroke-width="1.5" opacity=".7"/>
    <path d="M1228 151H1252M1238 141H1252" stroke="#e4c07a" stroke-width="1.5" opacity=".7"/>
  </g>

