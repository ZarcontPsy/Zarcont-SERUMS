    <path d="M58 36v30M43 51h30" stroke="url(#brass)" stroke-width="2" opacity=".55"/>
    <path d="M58 35l3 9 9 3-9 3-3 9-3-9-9-3 9-3 3-9z" fill="#f6e3b9" filter="url(#glowWarm)"/>
    <path d="M43 73c10 5 20 5 30 0" fill="none" stroke="url(#brass)" stroke-width="3"/>
    <path d="M80 88l14 8-14 6" stroke="#e4c07a" stroke-width="2" opacity=".65"/>
