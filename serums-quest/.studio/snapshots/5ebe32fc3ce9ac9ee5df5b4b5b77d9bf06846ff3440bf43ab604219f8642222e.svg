    <rect x="72" y="65" width="31" height="39" rx="2" fill="#2f3a37" stroke="url(#brass)" stroke-width="3"/>
    <rect x="79" y="72" width="17" height="24" fill="#69d3c1" fill-opacity=".7" filter="url(#glowBlue)"/>
    <path d="M72 104h31M80 109h14" stroke="#b98f55" stroke-width="2"/>
