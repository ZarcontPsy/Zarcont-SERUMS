    <circle cx="60" cy="96" r="22" fill="#14151f" stroke="#7c6646" stroke-width="2"/>
    <path d="M60 96V78M60 96l13 8" stroke="#ffe4b1" stroke-width="2.5" stroke-linecap="square"/>
    <rect x="55" y="57" width="10" height="9" fill="url(#brass)"/>
    <circle cx="60" cy="96" r="4" fill="url(#ember)" filter="url(#glowWarm)"/>
    <path d="M41 42c8 1 13 6 16 14M80 42c-8 1-13 6-16 14" stroke="#f3b562" stroke-width="2" opacity=".7"/>
