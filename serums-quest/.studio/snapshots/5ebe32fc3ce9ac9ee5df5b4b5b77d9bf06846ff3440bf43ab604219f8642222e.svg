    <circle cx="60" cy="93" r="22" fill="#101827" stroke="#6e6248" stroke-width="2"/>
    <path d="M60 74l7 19-7 19-7-19 7-19z" fill="url(#ice)" filter="url(#glowBlue)"/>
    <path d="M60 80v26" stroke="#0a1220" stroke-width="2"/>
    <rect x="56" y="50" width="8" height="8" fill="url(#brass)"/>
    <rect x="56" y="129" width="8" height="7" fill="url(#brass)"/>
    <rect x="27" y="89" width="7" height="8" fill="url(#brass)"/>
    <rect x="86" y="89" width="7" height="8" fill="url(#brass)"/>
