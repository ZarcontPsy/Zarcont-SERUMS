<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="256" viewBox="0 0 1280 256" fill="none">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d69c"/>
      <stop offset=".45" stop-color="#c59a58"/>
      <stop offset="1" stop-color="#7f5d32"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b7450"/>
      <stop offset="1" stop-color="#4e3524"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd8a1"/>
      <stop offset="1" stop-color="#ee754c"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e9ff"/>
      <stop offset="1" stop-color="#b983f2"/>
    </linearGradient>
    <filter id="glowBlue" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWarm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .frame{fill:rgba(9,14,24,.55);stroke:rgba(207,222,255,.12)}
      .cellname{fill:#e8edf8;font-family:'Segoe UI',sans-serif;font-size:10px;font-weight:700;letter-spacing:.2px;text-anchor:middle}
      .cellsub{fill:#8190ad;font-family:'Segoe UI',sans-serif;font-size:7.5px;font-weight:600;letter-spacing:.35px;text-anchor:middle;text-transform:uppercase}
      .edge{stroke:#0b1019;stroke-width:2}
    </style>
