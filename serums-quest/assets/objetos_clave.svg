    <path d="M108 267h40v-82l-20-24-20 24v82z" fill="#1a2948" stroke="#4c6ca8" stroke-width="2"/>
    <path d="M99 188h58l-9-22h-40l-9 22z" fill="#263b66" stroke="url(#gBrass)" stroke-width="2"/>
    <path d="M114 184h28v41h-28z" fill="#d8ecff" fill-opacity=".1" stroke="url(#gBlue)" stroke-width="2"/>
    <path d="M128 206c-7-9-21-5-21 6 0 10 14 17 21 25 7-8 21-15 21-25 0-11-14-15-21-6z" fill="url(#gBlue)" filter="url(#softGlow)"/>
