  <g transform="translate(512 0)">
    <ellipse cx="128" cy="430" rx="82" ry="10" fill="#05070c" opacity=".55"/>
    <circle cx="128" cy="214" r="136" fill="none" stroke="rgba(196,155,255,.1)"/>
    <circle cx="128" cy="214" r="102" fill="none" stroke="rgba(196,155,255,.16)" stroke-dasharray="2 9"/>
    <path d="M94 326l20-43h28l20 43" stroke="url(#gBrass)" stroke-width="7" stroke-linecap="square"/>
    <path d="M128 237v50M91 298h28M137 298h27" stroke="url(#gBrass)" stroke-width="2" opacity=".7"/>
    <ellipse cx="128" cy="199" rx="55" ry="67" fill="#2b1f40" stroke="url(#gBrass)" stroke-width="4"/>
    <ellipse cx="128" cy="199" rx="44" ry="55" fill="#090d17" stroke="#796394" stroke-width="2"/>
    <path d="M87 203c7-35 29-50 55-45 13 3 23 14 27 30-18-4-31 1-40 15-5 9-14 14-23 15-7 1-13-5-19-15z" fill="url(#gViolet)" fill-opacity=".66" filter="url(#softGlow)"/>
    <path d="M99 197c12-11 25-13 39-7M102 207c10-5 19-4 28 1" stroke="#f2e6ff" stroke-width="2" opacity=".55"/>
    <circle cx="139" cy="187" r="11" fill="none" stroke="#f2e6ff" stroke-width="1.5" opacity=".5"/>
    <path d="M139 180v7l5 4" stroke="#f2e6ff" stroke-width="1.5" opacity=".6"/>
    <path d="M192 152l5 11 11 5-11 5-5 11-5-11-11-5 11-5 5-11z" fill="#c49bff" filter="url(#lightGlow)" opacity=".9"/>
    <text x="128" y="391" class="name">Espejo de la confianza</text>
    <text x="128" y="412" class="area" fill="#c49bff">Ética · Objeto III</text>
    <text x="128" y="431" class="desc">Nada que se refleje aquí debe romperse.</text>
  </g>

  <!-- 04 · Prisma de la evidencia -->
  <g transform="translate(768 0)">
    <ellipse cx="128" cy="430" rx="82" ry="10" fill="#05070c" opacity=".55"/>
    <circle cx="128" cy="214" r="136" fill="none" stroke="rgba(184,212,106,.1)"/>
    <circle cx="128" cy="214" r="102" fill="none" stroke="rgba(184,212,106,.16)" stroke-dasharray="2 9"/>
    <path d="M128 311l-38-113 38-78 38 78-38 113z" fill="#1a2412" stroke="url(#gLime)" stroke-width="3"/>
    <path d="M128 127l32 66-32 91-32-91 32-66z" fill="url(#gLime)" fill-opacity=".2"/>
    <path d="M95 197h66M128 128v172" stroke="#e6ffca" stroke-width="1.5" opacity=".35"/>
    <path d="M83 215l37-101 42 101-42-21-37 21z" fill="url(#gLime)" fill-opacity=".38" filter="url(#softGlow)"/>
    <path d="M36 246l47-18M220 233l-47 17M62 314l45-30M201 309l-41-28" stroke="#b8d46a" stroke-width="1.5" opacity=".35"/>
    <circle cx="128" cy="110" r="4" fill="#e6ffca" filter="url(#lightGlow)"/>
    <circle cx="206" cy="251" r="3" fill="#b8d46a" opacity=".8"/>
    <circle cx="54" cy="299" r="2.5" fill="#b8d46a" opacity=".8"/>
    <path d="M57 164h32v23H57z" fill="none" stroke="#d7f0a1" stroke-width="1.5" opacity=".35"/>
    <path d="M64 172h12M64 178h17" stroke="#d7f0a1" stroke-width="1.5" opacity=".35"/>
    <text x="128" y="391" class="name">Prisma de la evidencia</text>
    <text x="128" y="412" class="area" fill="#b8d46a">Investigación · Objeto IV</text>
    <text x="128" y="431" class="desc">Separa el dato, el diseño y lo que aún falta.</text>
  </g>

  <!-- 05 · Plano del sistema -->
  <g transform="translate(1024 0)">
    <ellipse cx="128" cy="430" rx="82" ry="10" fill="#05070c" opacity=".55"/>
    <circle cx="128" cy="214" r="136" fill="none" stroke="rgba(243,181,98,.1)"/>
    <circle cx="128" cy="214" r="102" fill="none" stroke="rgba(243,181,98,.16)" stroke-dasharray="2 9"/>
    <path d="M66 115h123v171H66z" fill="#27251f" stroke="url(#gBrass)" stroke-width="3" transform="rotate(-4 128 200)"/>
    <path d="M76 137h102v128H76z" fill="#141f2f" stroke="#4b617e" stroke-width="1.5" transform="rotate(-4 128 200)"/>
    <path d="M92 169l36-18 34 17 27-8M109 194l22 31 36-35 21 20M118 275l-7-48 28-20 27 31" fill="none" stroke="#7aa2ff" stroke-width="1.6" opacity=".7" transform="rotate(-4 128 200)"/>
    <path d="M94 146h14v12H94zM143 140h20v19h-20zM167 202h15v14h-15zM108 225h13v13h-13z" fill="#f3b562" fill-opacity=".4" stroke="#f3b562" stroke-width="1.5" transform="rotate(-4 128 200)"/>
    <circle cx="128" cy="199" r="4" fill="#fff0cf" filter="url(#lightGlow)"/>
    <path d="M195 116l5 11 11 5-11 5-5 11-5-11-11-5 11-5 5-11z" fill="#f3b562" filter="url(#lightGlow)" opacity=".9"/>
    <path d="M45 284l23-8M51 300l23-8" stroke="#f3b562" stroke-width="1.5" opacity=".5"/>
    <path d="M195 76l13 23-13 23-13-23 13-23z" fill="none" stroke="#f3b562" stroke-width="1.5" opacity=".55"/>
    <text x="128" y="391" class="name">Plano del sistema</text>
    <text x="128" y="412" class="area" fill="#f3b562">Gestión · Objeto V</text>
    <text x="128" y="431" class="desc">Cada línea cuida a alguien que todavía no ves.</text>
  </g>
</svg>
