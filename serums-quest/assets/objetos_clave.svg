  <g transform="translate(0 0)">
    <ellipse cx="128" cy="430" rx="82" ry="10" fill="#05070c" opacity=".55"/>
    <circle cx="128" cy="214" r="136" fill="none" stroke="rgba(105,211,193,.1)"/>
    <circle cx="128" cy="214" r="102" fill="none" stroke="rgba(105,211,193,.16)" stroke-dasharray="2 9"/>
    <path d="M78 195l48-66 49 66-18 75H97l-19-75z" fill="#102a2c" stroke="#2f7068" stroke-width="2"/>
    <path d="M128 133v136M97 262h64" stroke="#235850" stroke-width="2" opacity=".8"/>
    <path d="M128 213c-16-7-23-22-20-41 20 1 32 12 33 29 1-17 12-29 31-30 5 20-2 35-23 42l-21 25v-25z" fill="url(#gTeal)" filter="url(#softGlow)"/>
    <path d="M127 221c0-22 8-43 22-56M131 204c-9-6-16-14-21-24" fill="none" stroke="#e5fff9" stroke-width="2" opacity=".75"/>
    <path d="M82 294c10 22 28 34 46 34 20 0 37-12 47-34" fill="none" stroke="url(#gBrass)" stroke-width="2.5" opacity=".8"/>
    <circle cx="128" cy="325" r="4" fill="#69d3c1" filter="url(#lightGlow)"/>
    <text x="128" y="391" class="name">Semilla del jardín</text>
    <text x="128" y="412" class="area" fill="#69d3c1">Salud pública · Objeto I</text>
    <text x="128" y="431" class="desc">Una promesa de comunidad que vuelve a crecer.</text>
  </g>

