<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="512" viewBox="0 0 1280 512" fill="none">
  <defs>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9fff4"/><stop offset=".5" stop-color="#69d3c1"/><stop offset="1" stop-color="#287f72"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4ecff"/><stop offset=".5" stop-color="#7aa2ff"/><stop offset="1" stop-color="#3659ad"/></linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2e6ff"/><stop offset=".5" stop-color="#c49bff"/><stop offset="1" stop-color="#6d4490"/></linearGradient>
    <linearGradient id="gLime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1ffd9"/><stop offset=".5" stop-color="#b8d46a"/><stop offset="1" stop-color="#6a7a35"/></linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0cf"/><stop offset=".5" stop-color="#f3b562"/><stop offset="1" stop-color="#94612e"/></linearGradient>
    <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4dda9"/><stop offset="1" stop-color="#8c673a"/></linearGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6fdff"/><stop offset="1" stop-color="#9fc9df"/></linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="lightGlow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .name{fill:#eef1f8;font-family:'Segoe UI',sans-serif;font-size:16px;font-weight:700;text-anchor:middle;letter-spacing:.1px}
      .area{fill:#8190ad;font-family:'Segoe UI',sans-serif;font-size:9px;font-weight:700;letter-spacing:.26em;text-anchor:middle;text-transform:uppercase}
      .desc{fill:#697791;font-family:'Segoe UI',sans-serif;font-size:9.5px;text-anchor:middle}
      .frame{fill:rgba(9,14,24,.5);stroke:rgba(207,222,255,.11)}
      .shadow{fill:#05070c;opacity:.55}
    </style>
  </defs>

  <rect x="12" y="12" width="1256" height="488" rx="22" fill="rgba(7,11,19,.23)" stroke="rgba(207,222,255,.08)"/>
  <path d="M44 34h42M44 42h26M1194 478h42M1210 470h26" stroke="#e4c07a" stroke-width="1.5" opacity=".45"/>

